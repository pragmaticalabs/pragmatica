name: CI

on:
  push:
    branches: [main, release-*, feature/*, 'overhaul/**', 'rewrite/**']
  pull_request:
    # overhaul/**, rewrite/** and feature/** are long-lived integration branches (#2222; feature/** for rc6, #2703): PRs into
    # them get the same gate as release-*
    branches: [main, release-*, 'overhaul/**', 'rewrite/**', 'feature/**']
  # Merge queue (rc5): every required context below is produced here and runs unfiltered on the queue's temporary branch.
  merge_group:
    branches: [main, release-*, 'overhaul/**', 'rewrite/**', 'feature/**']
  workflow_dispatch:

# A newer run on the same PR supersedes the in-progress one. Pushes get a per-commit group and are never
# cancelled: each merged commit's own run is evidence. A merge_group run takes the sha group and is likewise never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Duplicate push CI (T18): a feature branch with an open PR runs CI on `push` AND on `pull_request` for every head (#2648: 26 runs
  # for about 8 heads). On a push whose branch has an open PR into a base the pull_request trigger covers, every job below is
  # skipped, because the pull_request run of the same head is the one that gates. A branch with no such PR (a stacked feature
  # branch whose PR targets another feature branch, a branch with no PR yet) and every push to main or release-* still run.
  # If the lookup fails the run proceeds: a duplicate run is cheaper than a missing one.
  # A skipped job still posts a check run, and a skipped check run named like a required context SATISFIES it (observed on #2657:
  # mergeStateStatus UNSTABLE, not BLOCKED, while the pull_request run's real build-and-test had not started). So every skipped
  # job must post under a name no required context uses: the three single-instance required jobs (build-and-test, forge-tests,
  # stub-suites) rename themselves when skipping; the matrix jobs post their unexpanded `name:` template, which matches nothing.
  # The base list below must equal `pull_request.branches` above.
  push-dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.lookup.outputs.skip }}
    steps:
      - name: Does this pushed branch have an open PR that pull_request CI covers?
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          skip=false
          case "$EVENT:$BRANCH" in
            push:main|push:release-*) echo "push to a protected branch: its own run is the evidence" ;;
            push:*)
              if bases=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f "head=$OWNER:$BRANCH" --paginate --jq '.[] | select(.head.repo.full_name == "'"$REPO"'") | .base.ref'); then
                echo "open PR base(s) for $BRANCH: ${bases:-none}"
                for base in $bases; do
                  case "$base" in
                    main|release-*|overhaul/*|rewrite/*|feature/*) skip=true ;;
                  esac
                done
              else
                echo "::warning::PR lookup failed, running CI"
              fi ;;
          esac
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip"
  # The format/lint gate and the static pins: everything build-and-test checked before it tested. They need no module
  # build, so they run beside the test groups instead of in front of them; build-and-test needs this job, so a red here
  # still fails the required check.
  static-gates:
    needs: push-dedupe
    if: needs.push-dedupe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Test-port gate (#1710): on a pull request this checkout is the MERGE ref, the only place two sibling PRs that
      # claim the same test ports can see each other (#1688 and #1703 both took 14500+). Overlapping
      # TEST_PORT_ALLOCATION.md rows fail; unregistered fixed ports in */src/test are listed, warn-only until registered.
      - name: Test-port gate
        run: |
          python3 -B -m unittest discover -s tools -p test_check_test_ports.py
          python3 -B tools/check-test-ports.py

      # The Ember shard planner (#1643): every Ember test class lands in exactly one shard, for any shard count, and a class
      # with no weight plans at the default. The weights regenerate from a CI run's reports (tools/regen-shard-weights.py).
      - name: Ember shard planner pins
        run: |
          python3 -B -m unittest discover -s tools -p test_ember_shard.py
          python3 -B -m unittest discover -s tools -p test_regen_shard_weights.py

      # The heavy-forge nightly's reporting (#2017): what a night reads as (ok, red, unknown) and when the notify job may close the issue.
      # The same planner for Consensus (#2414), plus a check that the consensus-shard matrix below covers every Consensus test class.
      - name: Consensus shard planner pins
        run: python3 -B -m unittest discover -s tools -p test_consensus_shard.py

      - name: Heavy-forge workflow pins
        run: python3 -B -m unittest discover -s tools -p test_heavy_forge_workflow.py

      # Release checksums (#2235): SHA256SUMS covers every published asset by bare name; the check goes red when one is dropped.
      - name: Release checksums pins
        run: python3 -B -m unittest discover -s tools -p test_release_checksums.py

      # The build-and-test module groups: every reactor module with tests has exactly one owner (a test group below, or the
      # ember/consensus shard job), and the test-group matrix lists exactly the groups in tools/ci-test-groups.txt.
      - name: Module group coverage
        run: |
          python3 -B -m unittest discover -s tools -p test_ci_test_groups.py
          python3 -B tools/ci-test-groups.py check

      # Testcontainers image inventory (#3124): tools/ci-test-images.txt names every image the tests start, and the test-group
      # jobs pre-pull them with retry. A test that starts an unlisted image, or a listed image nothing starts, fails here.
      - name: Testcontainers image inventory
        run: |
          python3 -B -m unittest discover -s tools -p test_check_ci_test_images.py
          python3 -B tools/check-ci-test-images.py

      # Flaky-test quarantine (know 5544ec434b): every @Tag("quarantine") cites an issue on or above its line, and every
      # surefire/failsafe exclusion in the poms and in this workflow keeps the tag out of the required jobs. Offline by
      # design: this job is required, so it must not depend on GitHub's API. The quarantine job checks the issues are open.
      - name: Quarantine guard
        run: |
          python3 -B -m unittest discover -s tools -p test_check_quarantine.py
          python3 -B tools/check-quarantine.py check

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Bootstrap annotation processors and Maven plugins
        run: mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor,aether/pg-tools/pg-codegen -am

      # The gate build.sh runs locally and CI never did: format-check + lint. PR #618 passed CI and
      # still broke ./build.sh, because `mvn install` compiles unformatted, lint-violating sources
      # perfectly happily. Non-mutating (`check`, not `process`), so it reports rather than rewrites.
      # `-pl '!jbct'` mirrors build.sh: the linter depends on core, so jbct self-lints in its own build.
      # #1219: every published module's in-reactor dependencies (compile/runtime) and parent pom must publish too,
      # or the release puts artifacts on Central that no consumer can resolve. Static, so it runs on every PR.
      # #1988/#1989: publishing is opt-in, and docs/release/maven-central-publish-set.md must say what the poms decide.
      - name: Published-set dependency closure
        run: |
          python3 -B -m unittest discover -s tools -p test_publish_closure.py
          python3 tools/check-publish-closure.py
          python3 tools/check-publish-closure.py --check-table docs/release/maven-central-publish-set.md

      - name: Licence closure
        run: |
          python3 -B -m unittest discover -s tools -p test_licence_closure.py
          python3 tools/check-licence-closure.py
          python3 tools/license/relicense.py --check

      - name: JBCT format + lint gate
        run: mvn org.pragmatica-lite:jbct-maven-plugin:check -B -pl '!jbct'
        timeout-minutes: 15

  # build-and-test's module tests, split into groups that run in parallel. In one reactor each module's tests waited for
  # its upstream modules' tests: node started 25 min into run 41351583462's 45 min reactor. A group installs its modules'
  # upstream with -DskipTests (which still builds the statemachine test-jar) and then tests only its own modules, so every
  # module it reads is compiled in the same checkout: dead-surface-gate reads every aether module's target/classes.
  # The groups are tools/ci-test-groups.txt (regenerated from a run's reports); the matrix list must name exactly its groups.
  test-group:
    needs: push-dedupe
    if: needs.push-dedupe.outputs.skip != 'true'
    name: test-group-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        group: [g1, g2, g3, g4]
    env:
      # Anonymous Docker Hub pulls from shared runner IPs hit "toomanyrequests: unauthenticated pull rate limit".
      # Testcontainers prepends this to every Docker Hub image (postgres, mysql, localstack, testcontainers/ryuk); the
      # trailing slash is required. mirror.gcr.io is Google's auth-free Docker Hub cache. CI only: developer machines pull from Hub.
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Bootstrap annotation processors and Maven plugins
        run: mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor,aether/pg-tools/pg-codegen -am

      - name: Plan this group
        id: plan
        run: |
          python3 -B tools/ci-test-groups.py modules --group "${{ matrix.group }}" | tr ',' '\n' > "test-group-${{ matrix.group }}.txt"
          modules=$(python3 -B tools/ci-test-groups.py modules --group "${{ matrix.group }}")
          examples=$(python3 -B tools/ci-test-groups.py has-examples --group "${{ matrix.group }}")
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "examples=$examples" >> "$GITHUB_OUTPUT"

      - name: Install this group's upstream modules
        run: mvn install -B -DskipTests -pl "${{ steps.plan.outputs.modules }}" -am
        timeout-minutes: 15

      # A pull from the mirror fails transiently and a failed pull ejects a green PR from the merge queue (#3124): pull this
      # group's images first, 4 attempts at 10/20/40 s, failing the job here when one still fails. The list is checked
      # against the test sources by the static-gates job.
      - name: Pre-pull this group's Testcontainers images
        run: tools/ci-prepull-images.sh "test-group-${{ matrix.group }}.txt"
        timeout-minutes: 10

      # Ember's and Consensus's tests run in their shard jobs; postgres-async's integration tests are off by default and on here.
      # aether.requireDocker: a live-database test that finds no Docker daemon FAILS here instead of self-skipping (#2591, #3089).
      # Every Docker guard goes through org.pragmatica.testing.DockerRequirement; ubuntu-latest runners carry a Docker daemon.
      - name: Test this group's modules
        run: >
          mvn verify -B -pl "${{ steps.plan.outputs.modules }}"
          -Dember.skipTests=true -Dconsensus.skipTests=true -Dpostgres-async.skipTests=false -Daether.requireDocker=true
        timeout-minutes: 35

      # The control for the guard above (#2591): with Docker "hidden" and the require property set, a live-database
      # test must FAIL with the guard's own message. Fails this job if it passes, skips, or fails for any other reason.
      # It writes NO report files (surefire has no property for a separate reports directory): the failing XML would overwrite the real
      # TEST-...JdbcSqlConnectorPinnedTest.xml that the uploaded artifact must carry. The log it greps is its only output.
      - name: Docker-hidden control (the require guard must fail, never skip)
        if: matrix.group == 'g3'
        run: |
          if mvn test -B -pl aether/resource/db-jdbc -Daether.hideDocker=true -Daether.requireDocker=true \
               -Dtest=JdbcSqlConnectorPinnedTest -Dsurefire.failIfNoSpecifiedTests=false \
               -DdisableXmlReport=true -Dsurefire.useFile=false > docker-hidden-control.log 2>&1; then
            echo "::error::the Docker-hidden control passed: requireDocker no longer fails when Docker is absent"; exit 1
          fi
          grep -q "refusing to skip" docker-hidden-control.log || { echo "::error::the control failed for another reason"; tail -50 docker-hidden-control.log; exit 1; }
        timeout-minutes: 10

      - name: Verify examples (end-to-end pipeline check)
        if: steps.plan.outputs.examples == 'yes'
        run: mvn verify -B -f examples/pom.xml
        timeout-minutes: 15

      # The marker at the checkout root pins the artifact's root there: upload-artifact roots it at the matched files' common
      # ancestor, so a one-module group (g1 is aether/node alone) would otherwise lose the module path its reports sit under.
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.group }}
          if-no-files-found: error
          path: |
            test-group-${{ matrix.group }}.txt
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 7

  # The required check. It passes only when the static gates and every test group passed: `if: always()` is load-bearing,
  # because without it a failed group SKIPS this job, and a skipped required check counts as passing.
  build-and-test:
    name: ${{ needs.push-dedupe.outputs.skip == 'true' && 'build-and-test (duplicate push run, skipped)' || 'build-and-test' }}
    needs: [push-dedupe, static-gates, test-group]
    if: always() && needs.push-dedupe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Static gates and every test group passed
        run: |
          echo "static-gates: ${{ needs.static-gates.result }}, test-group: ${{ needs.test-group.result }}"
          [ "${{ needs.static-gates.result }}" = success ] && [ "${{ needs.test-group.result }}" = success ]

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download every group's test results
        uses: actions/download-artifact@v5
        with:
          pattern: test-results-*
          merge-multiple: true
          path: reports

      # A group that passed having tested nothing would still be green above; this fails a listed module that wrote no report.
      - name: Every grouped module reported
        run: python3 -B tools/ci-test-groups.py verify-reports reports

      - name: Upload merged test results
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          if-no-files-found: error
          path: reports/
          retention-days: 7

  forge-tests:
    name: ${{ needs.push-dedupe.outputs.skip == 'true' && 'forge-tests (duplicate push run, skipped)' || 'forge-tests' }}
    needs: push-dedupe
    if: needs.push-dedupe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Bootstrap annotation processors and Maven plugins
        run: mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor,aether/pg-tools/pg-codegen -am

      - name: Install all artifacts
        run: mvn install -B -DskipTests

      # StreamOwnerFailoverTest runs per PR since #1550 and deploys the standalone test-stream-repl
      # blueprint by coordinates; nothing in the reactor installs it. `clean` for the reason build.sh
      # gives: an incremental build re-jars stale generated factories.
      - name: Build test-stream-repl blueprint
        run: mvn -B -f aether/tests/blueprints/test-stream-repl/pom.xml clean install -DskipTests

      # #1684, #919: the standalone test blueprints and the standalone url-shortener examples are outside the reactor,
      # so no reactor gate checks their format or lint.
      - name: JBCT check standalone test blueprints and examples
        run: |
          shopt -s nullglob
          blueprints=(aether/tests/blueprints/*/pom.xml)
          (( ${#blueprints[@]} > 0 )) || { echo "no aether/tests/blueprints/*/pom.xml found; refusing to continue" >&2; exit 1; }
          poms=("${blueprints[@]}" examples/url-shortener/pom.xml examples/url-shortener-v2/pom.xml)
          for pom in "${poms[@]}"; do
            mvn -B jbct:check -f "$pom"
          done
          echo "JBCT-checked ${#poms[@]} standalone pom(s)"

      - name: Run Forge tests
        run: >
          mvn verify -B -Pwith-e2e -pl aether/forge/forge-tests
          -Dfailsafe.excludedGroups=Heavy,quarantine
          -Dfailsafe.forkedProcessTimeoutInSeconds=1800
        timeout-minutes: 30

      - name: Upload Forge test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: forge-test-results
          if-no-files-found: error
          path: |
            aether/forge/forge-tests/target/failsafe-reports/*.xml
          retention-days: 7

  # Ember's tests (#1643), split by class across runners. They are serial in one module and took 53 of build-and-test's
  # 89 minutes. The shard count is the matrix list's length: add an entry to go from 5 shards to 6. The required check
  # names are ember-shard-1 .. ember-shard-N. Five shards, on weights regenerated from run 41371046891, plan about 15.9 min of
  # tests each (4 shards planned 19.9 and measured a job of 21-23 min, the critical path), so the job is about 18 min and fits 35 with headroom.
  ember-shard:
    needs: push-dedupe
    if: needs.push-dedupe.outputs.skip != 'true'
    name: ember-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      SHARDS: ${{ strategy.job-total }}
      SHARD: ${{ matrix.shard }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Bootstrap annotation processors and Maven plugins
        run: mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor,aether/pg-tools/pg-codegen -am

      # Prints every shard's predicted total; fails if one is over budget (raise the matrix list) or this shard is empty.
      - name: Plan this shard
        id: plan
        run: |
          python3 -B -m unittest discover -s tools -p test_ember_shard.py
          classes=$(python3 -B tools/ember-shard.py --shards "$SHARDS" --index "$SHARD")
          echo "classes=$classes" >> "$GITHUB_OUTPUT"

      - name: Install Ember's upstream modules
        run: mvn install -B -DskipTests -pl aether/ember -am

      - name: Run Ember tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        run: mvn test -B -pl aether/ember -Dtest="${{ steps.plan.outputs.classes }}" -Dsurefire.failIfNoSpecifiedTests=false
        timeout-minutes: 30

      # The plan-completed gate passes a run with zero tests; this fails one. Every class assigned to this shard must have reported.
      - name: Verify this shard ran its classes
        run: python3 -B tools/ember-shard.py --shards "$SHARDS" --index "$SHARD" --verify aether/ember/target/surefire-reports

      - name: Upload Ember test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ember-test-results-${{ matrix.shard }}
          if-no-files-found: error
          path: |
            aether/ember/target/surefire-reports/*.xml
          retention-days: 7

  # Consensus's tests (#2414), split by class across runners with the Ember planner. They are serial in one module and
  # sat on build-and-test's longest dependency chain (~18 of its ~46 min). The shard count is the matrix list's length:
  # add an entry to go from 2 shards to 3. The required check names are consensus-shard-1 .. consensus-shard-N.
  consensus-shard:
    needs: push-dedupe
    if: needs.push-dedupe.outputs.skip != 'true'
    name: consensus-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SHARDS: ${{ strategy.job-total }}
      SHARD: ${{ matrix.shard }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Bootstrap annotation processors and Maven plugins
        run: mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor,aether/pg-tools/pg-codegen -am

      # Prints every shard's predicted total; fails if one is over budget (raise the matrix list) or this shard is empty.
      - name: Plan this shard
        id: plan
        run: |
          python3 -B -m unittest discover -s tools -p test_consensus_shard.py
          classes=$(python3 -B tools/ember-shard.py --module consensus --shards "$SHARDS" --index "$SHARD")
          echo "classes=$classes" >> "$GITHUB_OUTPUT"

      - name: Install Consensus's upstream modules
        run: mvn install -B -DskipTests -pl integrations/consensus -am

      - name: Run Consensus tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        run: mvn test -B -pl integrations/consensus -Dtest="${{ steps.plan.outputs.classes }}" -Dsurefire.failIfNoSpecifiedTests=false
        timeout-minutes: 25

      # The plan-completed gate passes a run with zero tests; this fails one. Every class assigned to this shard must have reported.
      - name: Verify this shard ran its classes
        run: python3 -B tools/ember-shard.py --module consensus --shards "$SHARDS" --index "$SHARD" --verify integrations/consensus/target/surefire-reports

      - name: Upload Consensus test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: consensus-test-results-${{ matrix.shard }}
          if-no-files-found: error
          path: |
            integrations/consensus/target/surefire-reports/*.xml
          retention-days: 7

  # Flaky-test quarantine (know 5544ec434b): runs exactly the @Tag("quarantine") tests, so they stay exercised and visible.
  # NOT a required check and not in build-and-test's needs: its result is reported and never gates a merge. Every required
  # job excludes the tag (tools/check-quarantine.py); this job clears each exclusion and selects only the tag.
  quarantine:
    needs: push-dedupe
    if: needs.push-dedupe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Find the quarantined tests
        id: plan
        run: |
          modules=$(python3 -B tools/check-quarantine.py modules)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "quarantined modules: ${modules:-none}"
          [ -n "$modules" ] && echo "$modules" | tr ',' '\n' > quarantine-modules.txt || true

      - name: Set up Java 25
        if: steps.plan.outputs.modules != ''
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Bootstrap annotation processors and Maven plugins
        if: steps.plan.outputs.modules != ''
        run: mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor,aether/pg-tools/pg-codegen -am

      # -Pwith-e2e makes a profile-only module such as forge-tests selectable by -pl.
      - name: Install the quarantined modules' upstream
        if: steps.plan.outputs.modules != ''
        run: mvn install -B -DskipTests -Pwith-e2e -pl "${{ steps.plan.outputs.modules }}" -am

      - name: Build test-stream-repl blueprint
        if: contains(steps.plan.outputs.modules, 'aether/forge/forge-tests')
        run: mvn -B -f aether/tests/blueprints/test-stream-repl/pom.xml clean install -DskipTests

      # -Dgroups selects the tag in surefire and failsafe; each exclusion slot is cleared, and the two modules whose
      # <groups> is a property get the tag through it. Ember's, Consensus's and postgres-async's tests are on.
      - name: Run the quarantined tests
        if: steps.plan.outputs.modules != ''
        run: >
          mvn verify -B -Pwith-e2e -pl "${{ steps.plan.outputs.modules }}"
          -Dgroups=quarantine -Dsurefire.excludedGroups= -Dfailsafe.excludedGroups=
          -DheavyDb.excludedGroups= -DheavyDb.includedGroups=quarantine -Dpostgres-async.excludedGroups=
          -Dember.skipTests=false -Dconsensus.skipTests=false -Dpostgres-async.skipTests=false
        timeout-minutes: 45

      - name: Upload quarantine test results
        uses: actions/upload-artifact@v6
        if: always() && steps.plan.outputs.modules != ''
        with:
          name: quarantine-test-results
          if-no-files-found: error
          path: |
            quarantine-modules.txt
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 7

      # A tag whose issue was closed is a quarantine nobody owns any more: it turns this job red. Last, and always, so the
      # quarantined tests above still run. An API error here exits non-zero as "could not look"; this job never gates.
      - name: Every quarantine tag cites an open issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/check-quarantine.py issues --repo "${{ github.repository }}"

  # The cloud harness stub suites (aether/tests/integration/test/test-*.sh) pin harness decisions such
  # as drain confirmation and reap refusal by stubbing ssh/hcloud/curl. They need no cluster, cloud or
  # docker, and before #1060 nothing ran them. The runner fails a suite that exits non-zero OR whose own
  # summary is missing, reports failures, or reports zero passes.
  #
  # Runaway guard: each suite runs in its own process group. The whole group is killed at 300s or 300
  # processes, whichever comes first. Measured: the job took 7-8s with one suite (test-cloud-helpers.sh,
  # under 1s); #1053's test-chaos-harness.sh took 21s locally and 59s at load average 34. 300s is about 5x
  # the contended figure. A wedged suite costs ~307s (300s wait + 2s TERM grace + up to 5s for the KILL),
  # so three suites all wedged are ~15.4 min; the 25-minute job cap covers that plus setup, holds a fourth
  # suite, and still stops a runner-level hang long before GitHub's 6-hour default.
  stub-suites:
    name: ${{ needs.push-dedupe.outputs.skip == 'true' && 'stub-suites (duplicate push run, skipped)' || 'stub-suites' }}
    needs: push-dedupe
    if: needs.push-dedupe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Tools the suites use
        run: bash --version | head -1 && awk --version 2>&1 | head -1 && sed --version | head -1 && command -v mktemp tee perl pgrep mkfifo

      # #2029: run-tests.sh runs lint-tests.sh under `set -euo pipefail`, so a finding that is not in lint-baseline.txt aborts
      # every integration run before anything is provisioned. CI never ran it, so the PR that introduced the finding merged green.
      # Waivers are keyed by file + line content, so only a NEW or EDITED finding fails here, not a shifted line.
      - name: Integration test lint
        run: bash aether/tests/integration/lint-tests.sh

      - name: Run harness stub suites
        env:
          STUB_SUITE_PGID_FILE: ${{ runner.temp }}/stub-suite-pgids.txt
        run: bash aether/tests/integration/test/run-stub-suites.sh

      # An independent check of the runner's own "none left" claim: a ps snapshot written to a file,
      # matched against the process group of every suite the runner recorded.
      - name: No stub-suite process survives
        if: always()
        run: |
          pgids="${RUNNER_TEMP}/stub-suite-pgids.txt"
          snap="${RUNNER_TEMP}/ps-after-stub-suites.txt"
          ps -eo pid=,pgid=,etime=,args= > "$snap"
          if [ ! -s "$pgids" ]; then
            echo "no suite process groups were recorded, so this check examined nothing" >&2
            exit 1
          fi
          echo "recorded suites: $(wc -l < "$pgids"); processes in snapshot: $(wc -l < "$snap")"
          awk 'NR == FNR { suite[$2] = $1; next }
               ($2 in suite) { print "SURVIVOR of " suite[$2] ": " $0; n++ }
               END { print (n + 0) " processes survive in recorded suite groups"; exit (n > 0) }' "$pgids" "$snap"

  # Heavy forge tests run in heavy-forge.yml (nightly, on demand, or on a PR labelled run-heavy).

  # E2E tests removed — replaced by Docker-based integration test suite
  # at aether/tests/integration/ (run manually on dedicated hardware).
  # See: aether/tests/integration/README.md
