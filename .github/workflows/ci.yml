name: CI

on:
  push:
    branches: [main, release-*, feature/*]
  pull_request:
    branches: [main, release-*]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Bootstrap annotation processors and Maven plugins
        run: mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor,aether/pg-tools/pg-codegen -am

      # The gate build.sh runs locally and CI never did: format-check + lint. PR #618 passed CI and
      # still broke ./build.sh, because `mvn install` compiles unformatted, lint-violating sources
      # perfectly happily. Non-mutating (`check`, not `process`), so it reports rather than rewrites.
      # `-pl '!jbct'` mirrors build.sh: the linter depends on core, so jbct self-lints in its own build.
      - name: JBCT format + lint gate
        run: mvn org.pragmatica-lite:jbct-maven-plugin:check -B -pl '!jbct'
        timeout-minutes: 15

      - name: Build and test all modules
        run: mvn install -B -pl '!examples'
        timeout-minutes: 45

      - name: Run postgres-async integration tests
        run: mvn test -B -pl integrations/db/postgres-async -Dpostgres-async.skipTests=false
        timeout-minutes: 10

      - name: Verify examples (end-to-end pipeline check)
        run: mvn verify -B -f examples/pom.xml
        timeout-minutes: 15

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 7

  forge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Bootstrap annotation processors and Maven plugins
        run: mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor,aether/pg-tools/pg-codegen -am

      - name: Install all artifacts
        run: mvn install -B -DskipTests

      - name: Run Forge tests
        run: >
          mvn verify -B -Pwith-e2e -pl aether/forge/forge-tests
          -Dfailsafe.excludedGroups=Heavy
        timeout-minutes: 30

      - name: Upload Forge test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-test-results
          path: |
            aether/forge/forge-tests/target/failsafe-reports/*.xml
          retention-days: 7

  # E2E tests removed — replaced by Docker-based integration test suite
  # at aether/tests/integration/ (run manually on dedicated hardware).
  # See: aether/tests/integration/README.md
