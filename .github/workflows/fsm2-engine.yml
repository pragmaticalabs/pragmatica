name: FSM2 engine (Ember shards)

# The Ember corpus on the FSM2 deployment engine (FSM replacement plan F1 item 7, review FIX F1). Every EmberCluster reads the
# global selector -Daether.deployment.engine (EngineSelector), so this is ci.yml's ember-shard job with the selector set to fsm2.
# LEGACY stays the default everywhere else; FSM2 is test-only until the flip (plan D.3).
#
# Not a required check: until the FSM2 parity phases (F2-F5) land, reds here are the FSM2 gap list, not regressions. It runs on
# workflow_dispatch (pick the ref) and on a pull request carrying the `run-fsm2` label (re-run on each push while the label stays).
# A misspelt engine value fails every cluster start (EngineSelectorTest), so a green run cannot be a LEGACY run in disguise.
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main, release-*]
    types: [labeled, synchronize, reopened]

jobs:
  fsm2-ember-shard:
    name: fsm2-ember-shard-${{ matrix.shard }}
    # A labelled event for some other label must not start (or cancel) an FSM2 run.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run-fsm2') &&
       (github.event.action != 'labeled' || github.event.label.name == 'run-fsm2'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: fsm2-engine-${{ github.event.pull_request.number || github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      SHARDS: ${{ strategy.job-total }}
      SHARD: ${{ matrix.shard }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Bootstrap annotation processors and Maven plugins
        run: mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor,aether/pg-tools/pg-codegen -am

      # Prints every shard's predicted total; fails if one is over budget (raise the matrix list) or this shard is empty.
      # Assign before echo: an exit status inside `echo "x=$(...)"` is discarded, and an empty -Dtest runs the whole corpus (#3237).
      - name: Plan this shard
        id: plan
        run: |
          python3 -B -m unittest discover -s tools -p test_ember_shard.py
          classes=$(python3 -B tools/ember-shard.py --shards "$SHARDS" --index "$SHARD")
          echo "classes=$classes" >> "$GITHUB_OUTPUT"

      - name: Install Ember's upstream modules
        run: mvn install -B -DskipTests -pl aether/ember -am

      - name: Run Ember tests on FSM2 (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        run: >-
          mvn test -B -pl aether/ember -Daether.deployment.engine=fsm2
          -Dtest="${{ steps.plan.outputs.classes }}" -Dsurefire.failIfNoSpecifiedTests=false
        timeout-minutes: 30

      # A run that never reached FSM2 is not evidence. Surefire records the forked JVM's system properties in every report, and every
      # EmberCluster reads its engine from that property (EngineSelector): each report of this shard must carry it set to fsm2.
      - name: Verify the test JVMs ran with the FSM2 selector
        run: |
          total=$(ls aether/ember/target/surefire-reports/TEST-*.xml | wc -l)
          fsm2=$(grep -l 'name="aether.deployment.engine" value="fsm2"' aether/ember/target/surefire-reports/TEST-*.xml | wc -l)
          echo "reports: $total, carrying aether.deployment.engine=fsm2: $fsm2"
          [ "$total" -gt 0 ] && [ "$fsm2" -eq "$total" ] || { echo "the selector did not reach every test JVM"; exit 1; }

      - name: Verify this shard ran its classes
        run: python3 -B tools/ember-shard.py --shards "$SHARDS" --index "$SHARD" --verify aether/ember/target/surefire-reports

      - name: Upload FSM2 Ember test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fsm2-ember-test-results-${{ matrix.shard }}
          if-no-files-found: error
          path: |
            aether/ember/target/surefire-reports/*.xml
          retention-days: 7
