# Model-checks the TLA+ models embedded in the Java sources (tools/tla/README.md).
# Runs: on demand (workflow_dispatch), on a push to release-1.0.0-rc6 that touches tools/tla/** or a Java file carrying a
# tla fragment (the paths list below is generated: tools/tla/fragment-paths.py --sync, checked by a step of this job), and
# on a schedule. Never on a pull request, and not a required check: a red run is a flake-priority issue.
# The schedule fires only from the DEFAULT branch's copy of this file. The default branch is release-1.0.0-rc6 and its copy
# of this file has the dispatch trigger only, so the schedule starts when this file reaches release-1.0.0-rc6; the schedule
# checks out RELEASE_BRANCH explicitly, whatever the default is. Scheduled and pushed runs use profile small and every
# module; the schedule adds profile heavy for the models that have a heavy row.
# Trigger by hand: gh workflow run tla-models.yml -f profile=small -f modules='.*'
# One job per model (a matrix planned by tools/tla/plan-matrix.py from models.tsv), so the wall time of a run is the slowest
# model's, not the sum. A row marked `heavy` in models.tsv (it does not finish inside the small budget) is not run by the
# small profile and is never counted as a pass: it is recorded as SKIPPED-HEAVY by name, and runs in the heavy profile, which
# the schedule and a manual dispatch (profile heavy) run, for the models that have such rows.
# Every config in tools/tla/models.tsv runs with its expected verdict: the known-bad configs must FAIL, so a model
# that stopped reaching its code turns the run red, and a known-bad row is satisfied only by a violation of the property
# it names. Results are bounds, never proofs; the sim profile is random sampling, the weakest of the three.
name: TLA+ models

on:
  push:
    branches:
      - release-1.0.0-rc6
    paths:
      - 'tools/tla/**'
      - '.github/workflows/tla-models.yml'
      # BEGIN fragment-paths (generated by tools/tla/fragment-paths.py --sync; do not edit by hand)
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/ClusterFsm.java'
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/Failures.java'
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/Lifecycle.java'
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/Outbox.java'
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/Reconcile.java'
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/Warnings.java'
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/package-info.java'
      - 'aether/aether-stream/src/main/java/org/pragmatica/aether/stream/replication/PartitionBackfill.java'
      - 'aether/aether-stream/src/main/java/org/pragmatica/aether/stream/replication/package-info.java'
      - 'aether/resource/api/src/main/java/org/pragmatica/aether/resource/SharedPools.java'
      - 'aether/resource/api/src/main/java/org/pragmatica/aether/resource/SpiResourceProvider.java'
      - 'aether/resource/api/src/main/java/org/pragmatica/aether/resource/package-info.java'
      - 'integrations/consensus/src/main/java/org/pragmatica/consensus/leader/LeaderManager.java'
      - 'integrations/consensus/src/main/java/org/pragmatica/consensus/leader/fsm/LeaderElectionState.java'
      - 'integrations/consensus/src/main/java/org/pragmatica/consensus/leader/fsm/package-info.java'
      - 'integrations/consensus/src/main/java/org/pragmatica/consensus/rabia/PhaseData.java'
      - 'integrations/consensus/src/main/java/org/pragmatica/consensus/rabia/RabiaEngine.java'
      - 'integrations/consensus/src/main/java/org/pragmatica/consensus/rabia/package-info.java'
      - 'integrations/dht/src/main/java/org/pragmatica/dht/DHTAntiEntropy.java'
      - 'integrations/dht/src/main/java/org/pragmatica/dht/DHTTopologyListener.java'
      - 'integrations/dht/src/main/java/org/pragmatica/dht/DeparturePushRun.java'
      - 'integrations/dht/src/main/java/org/pragmatica/dht/package-info.java'
      # END fragment-paths
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      modules:
        description: 'Model filter: a regex over models.tsv module names (e.g. SharedPools, Stalled, .* for all)'
        required: false
        default: '.*'
        type: string
      profile:
        description: 'Bounds: small (reduced constants; heavy rows skipped by name), heavy (only the rows marked heavy, as written, hours), full (every config as written, hours) or sim (random simulation of every config as written, a time budget each; sampling, not a proof)'
        required: false
        default: small
        type: choice
        options:
          - small
          - heavy
          - full
          - sim

permissions:
  contents: read

concurrency:
  group: tla-models-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: release-1.0.0-rc6
  # The jar is the owner-approved asset of this repository's release tla2tools-2026.11.06, not a download from the TLA+ project
  # (tools/tla/README.md, "Where the jar comes from"). The checksum is the pin: it is the only thing a job trusts.
  TLA_JAR_URL: https://github.com/pragmaticalabs/pragmatica/releases/download/tla2tools-2026.11.06/tla2tools.jar
  TLA_SHA256: e1f11b75c4b5bc4478ba0ac5cb6ae28e40a01b0016bc33e0aa97da22dfdbcd7f

jobs:
  # Plan the shards: one per (model, profile). push and schedule carry no inputs; plan-matrix.py reads the event.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # a scheduled run starts on the default branch; the models belong to the release branch
          ref: ${{ github.event_name == 'schedule' && env.RELEASE_BRANCH || '' }}

      - name: Plan one job per model
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PROFILE: ${{ inputs.profile || 'small' }}
          MODULES: ${{ inputs.modules || '.*' }}
        run: |
          set -euo pipefail
          matrix=$(python3 tools/tla/plan-matrix.py --event "$EVENT" --profile "$PROFILE" --modules "$MODULES")
          echo "$matrix" | python3 -m json.tool
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Checks that do not depend on a model: the scripts' own tests, once per run
  selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TLA_JAR: ${{ github.workspace }}/.tla/tla2tools.jar
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && env.RELEASE_BRANCH || '' }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Cache tla2tools.jar
        id: tla-cache
        uses: actions/cache@v4
        with:
          path: .tla/tla2tools.jar
          key: tla2tools-${{ env.TLA_SHA256 }}

      - name: Download tla2tools.jar
        if: steps.tla-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tla
          curl -fsSL -o .tla/tla2tools.jar "${TLA_JAR_URL}"

      - name: Verify tla2tools.jar checksum
        run: echo "${TLA_SHA256}  .tla/tla2tools.jar" | sha256sum -c -

      - name: Python self-tests (fragment paths, shard plan, evidence rows, workflow wiring)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tla -p 'test_fragment_paths.py' -v
          python3 -m unittest discover -s tools/tla -p 'test_plan_matrix.py' -v
          python3 -m unittest discover -s tools/tla -p 'test_results_check.py' -v
          python3 -m unittest discover -s tools/tla -p 'test_workflow.py' -v
          python3 tools/tla/fragment-paths.py --check

      - name: Runner self-test
        run: bash tools/tla/runselftest.sh

  model-check:
    name: ${{ matrix.module }} (${{ matrix.profile }})
    needs: [plan, selftests]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false   # a red model must not hide the verdicts of the others
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TLA_JAR: ${{ github.workspace }}/.tla/tla2tools.jar
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && env.RELEASE_BRANCH || '' }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Cache tla2tools.jar
        id: tla-cache
        uses: actions/cache@v4
        with:
          path: .tla/tla2tools.jar
          key: tla2tools-${{ env.TLA_SHA256 }}

      - name: Download tla2tools.jar
        if: steps.tla-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tla
          curl -fsSL -o .tla/tla2tools.jar "${TLA_JAR_URL}"

      - name: Verify tla2tools.jar checksum
        run: echo "${TLA_SHA256}  .tla/tla2tools.jar" | sha256sum -c -

      - name: Extractor self-test (${{ matrix.module }})
        run: bash tools/tla/selftest.sh "${{ matrix.module }}" "${{ matrix.root }}"

      - name: Model check (${{ matrix.module }}, ${{ matrix.profile }})
        env:
          TLC_WORKERS: auto
          TLA_OUT: target/tla
          TLC_TIMEOUT: ${{ matrix.tlc_timeout }}
          MODULE: ${{ matrix.module }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          bash tools/tla/run.sh "$PROFILE" "$MODULE" | tee target-tla-summary.txt

      - name: Upload TLC output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tla-models-${{ matrix.module }}-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            target/tla/
            target-tla-summary.txt
          if-no-files-found: warn
          retention-days: 30

      # the evidence rows of this shard (tools/tla/README.md, "Evidence rows") as an artifact of their own, so the rows of a
      # scheduled run can be downloaded and compared without unpacking the TLC logs
      - name: Upload evidence rows
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tla-results-${{ matrix.module }}-${{ matrix.profile }}-${{ github.run_id }}
          path: target/tla/results.tsv
          if-no-files-found: warn
          retention-days: 90
