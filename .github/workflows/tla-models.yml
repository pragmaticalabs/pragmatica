# Model-checks the TLA+ models embedded in the Java sources (tools/tla/README.md).
# Runs: on demand (workflow_dispatch), on a push to release-1.0.0-rc6 that touches tools/tla/** or a Java file carrying a
# tla fragment (the paths list below is generated: tools/tla/fragment-paths.py --sync, checked by a step of this job), and
# on a schedule. Never on a pull request, and not a required check: a red run is a flake-priority issue.
# The schedule fires only from the DEFAULT branch's copy of this file (today release-1.0.0-rc5, stale), so it is dormant
# until the default branch moves; it checks out RELEASE_BRANCH explicitly, whatever the default is. Until then the push
# trigger is what runs the models. Scheduled and pushed runs use profile small and every module.
# Trigger by hand: gh workflow run tla-models.yml -f profile=small -f modules='.*'
# Every config in tools/tla/models.tsv runs with its expected verdict: the known-bad configs must FAIL, so a model
# that stopped reaching its code turns the run red, and a known-bad row is satisfied only by a violation of the property
# it names. Results are bounds, never proofs; the sim profile is random sampling, the weakest of the three.
name: TLA+ models

on:
  push:
    branches:
      - release-1.0.0-rc6
    paths:
      - 'tools/tla/**'
      - '.github/workflows/tla-models.yml'
      # BEGIN fragment-paths (generated by tools/tla/fragment-paths.py --sync; do not edit by hand)
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/ClusterFsm.java'
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/Failures.java'
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/Lifecycle.java'
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/Outbox.java'
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/Reconcile.java'
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/Warnings.java'
      - 'aether/aether-deployment/src/main/java/org/pragmatica/aether/deployment/cluster/fsm2/package-info.java'
      - 'aether/aether-stream/src/main/java/org/pragmatica/aether/stream/replication/PartitionBackfill.java'
      - 'aether/aether-stream/src/main/java/org/pragmatica/aether/stream/replication/package-info.java'
      - 'aether/resource/api/src/main/java/org/pragmatica/aether/resource/SharedPools.java'
      - 'aether/resource/api/src/main/java/org/pragmatica/aether/resource/SpiResourceProvider.java'
      - 'aether/resource/api/src/main/java/org/pragmatica/aether/resource/package-info.java'
      - 'integrations/consensus/src/main/java/org/pragmatica/consensus/rabia/PhaseData.java'
      - 'integrations/consensus/src/main/java/org/pragmatica/consensus/rabia/RabiaEngine.java'
      - 'integrations/consensus/src/main/java/org/pragmatica/consensus/rabia/package-info.java'
      # END fragment-paths
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      modules:
        description: 'Model filter: a regex over models.tsv module names (e.g. SharedPools, Stalled, .* for all)'
        required: false
        default: '.*'
        type: string
      profile:
        description: 'Bounds: small (reduced constants, minutes), full (every config as written, hours) or sim (random simulation of every config as written, a time budget each; sampling, not a proof)'
        required: false
        default: small
        type: choice
        options:
          - small
          - full
          - sim

permissions:
  contents: read

concurrency:
  group: tla-models-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: release-1.0.0-rc6
  # push and schedule carry no inputs: small profile, every module
  PROFILE: ${{ inputs.profile || 'small' }}
  MODULES: ${{ inputs.modules || '.*' }}
  TLA_VERSION: v1.8.0
  TLA_SHA256: e1f11b75c4b5bc4478ba0ac5cb6ae28e40a01b0016bc33e0aa97da22dfdbcd7f
  TLA_JAR: ${{ github.workspace }}/.tla/tla2tools.jar

jobs:
  model-check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.profile == 'full' && 350 || 45 }}   # an absent input (push, schedule) reads as small
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # a scheduled run starts on the default branch; the models belong to the release branch
          ref: ${{ github.event_name == 'schedule' && env.RELEASE_BRANCH || '' }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Cache tla2tools.jar
        id: tla-cache
        uses: actions/cache@v4
        with:
          path: .tla/tla2tools.jar
          key: tla2tools-${{ env.TLA_VERSION }}-${{ env.TLA_SHA256 }}

      - name: Download tla2tools.jar
        if: steps.tla-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tla
          curl -fsSL -o .tla/tla2tools.jar "https://github.com/tlaplus/tlaplus/releases/download/${TLA_VERSION}/tla2tools.jar"

      - name: Verify tla2tools.jar checksum
        run: echo "${TLA_SHA256}  .tla/tla2tools.jar" | sha256sum -c -

      - name: Fragment paths self-test
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tla -p 'test_fragment_paths.py' -v
          python3 tools/tla/fragment-paths.py --check

      - name: Extractor self-test
        run: |
          set -euo pipefail
          grep -vE '^[[:space:]]*(#|$)' tools/tla/models.tsv | awk -F'\t' -v f="$MODULES" '$1 ~ "^(" f ")$" { print $1 "\t" $2 }' | sort -u > modules.tsv
          test -s modules.tsv || { echo "no model matches '$MODULES'"; exit 2; }
          while IFS=$'\t' read -r module root; do
            echo "::group::selftest $module"
            bash tools/tla/selftest.sh "$module" "$root"
            echo "::endgroup::"
          done < modules.tsv

      - name: Runner self-test
        run: bash tools/tla/runselftest.sh

      - name: Evidence-row check self-test
        run: python3 -m unittest discover -s tools/tla -p 'test_results_check.py' -v

      - name: Model check (${{ env.PROFILE }})
        env:
          TLC_WORKERS: auto
          TLA_OUT: target/tla
        run: |
          set -euo pipefail
          case "$PROFILE" in full) export TLC_TIMEOUT=18000 ;; sim) export TLC_TIMEOUT=300 ;; *) export TLC_TIMEOUT=1200 ;; esac
          bash tools/tla/run.sh "$PROFILE" "$MODULES" | tee target-tla-summary.txt

      - name: Upload TLC output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tla-models-${{ env.PROFILE }}-${{ github.run_id }}
          path: |
            target/tla/
            target-tla-summary.txt
          if-no-files-found: warn
          retention-days: 30

      # the evidence rows of this run (tools/tla/README.md, "Evidence rows") as an artifact of their own, so a scheduled
      # run's rows can be downloaded and compared without unpacking the TLC logs
      - name: Upload evidence rows
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tla-results-${{ env.PROFILE }}-${{ github.run_id }}
          path: target/tla/results.tsv
          if-no-files-found: warn
          retention-days: 90
