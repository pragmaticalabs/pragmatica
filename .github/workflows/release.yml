name: Release

on:
  push:
    tags:
      - 'v*'
  # DRY RUN (#2235): on workflow_dispatch and on pull_request, builds every asset and runs the checksum job over them, publishes NOTHING. A dispatch can never publish: every
  # publishing step (release, upload, image push) is guarded by `github.event_name == 'push'`, i.e. the tag trigger, not by an input
  # a dispatcher could flip. Assets travel between jobs as workflow artifacts instead of release assets.
  # The same dry run on a pull request that touches the checksum script or this workflow, so the real job runs in that PR's own CI.
  pull_request:
    paths:
      - 'scripts/release-checksums.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for the dry-run archive names (no tag exists)'
        default: '0.0.0-dryrun'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Bootstrap jbct-maven-plugin and slice-processor
        run: mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor -am

      - name: Build all packages
        run: mvn package -B -DskipTests

      - name: Extract version from tag
        id: version
        env:
          DRY_RUN_VERSION: ${{ inputs.version || '0.0.0-dryrun' }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          [[ "$GITHUB_EVENT_NAME" == push ]] || VERSION="$DRY_RUN_VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # A `-candidate` tag marks the artifact UNDER TEST. Neither the `latest` image tag nor
          # the GitHub "Latest release" pointer may follow it: doing so aims every un-pinned
          # `docker pull` and every install script at a build that has not been smoke-tested.
          # Measured 2026-09-09: pushing v1.0.0-rc4-candidate made an 11-of-23-asset release the
          # answer to /releases/latest, and would have moved the `latest` image tag with it.
          if [[ "$VERSION" == *-candidate ]]; then
            echo "IS_CANDIDATE=true"  >> $GITHUB_OUTPUT
          else
            echo "IS_CANDIDATE=false" >> $GITHUB_OUTPUT
          fi

      - name: Build distribution archives (linux-amd64)
        run: |
          chmod +x aether/dist/build-dist.sh
          aether/dist/build-dist.sh --version ${{ steps.version.outputs.VERSION }}

      - name: Stage dry-run assets
        if: github.event_name != 'push'
        run: |
          mkdir dryrun-assets
          cp jbct/jbct-cli/target/jbct.jar aether/cli/target/aether.jar aether/node/target/aether-node.jar aether/forge/forge-core/target/aether-forge.jar dryrun-assets/
          cp aether/dist/output/*.tar.gz aether/dist/output/*.zip dryrun-assets/

      - name: Keep dry-run assets as a workflow artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v6
        with:
          name: dryrun-assets-linux-amd64
          if-no-files-found: error
          path: dryrun-assets/*
          retention-days: 3

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: Pragmatica ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ steps.version.outputs.IS_CANDIDATE }}
          generate_release_notes: true
          files: |
            jbct/jbct-cli/target/jbct.jar
            aether/cli/target/aether.jar
            aether/node/target/aether-node.jar
            aether/forge/forge-core/target/aether-forge.jar
            aether/dist/output/*.tar.gz
            aether/dist/output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build macOS archives on a macOS runner and attach to the release
  build-macos-dist:
    runs-on: macos-latest
    needs: build-and-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Bootstrap jbct-maven-plugin and slice-processor
        run: mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor -am

      - name: Build all packages
        run: mvn package -B -DskipTests

      - name: Extract version from tag
        id: version
        env:
          DRY_RUN_VERSION: ${{ inputs.version || '0.0.0-dryrun' }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          [[ "$GITHUB_EVENT_NAME" == push ]] || VERSION="$DRY_RUN_VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # A `-candidate` tag marks the artifact UNDER TEST. Neither the `latest` image tag nor
          # the GitHub "Latest release" pointer may follow it: doing so aims every un-pinned
          # `docker pull` and every install script at a build that has not been smoke-tested.
          # Measured 2026-09-09: pushing v1.0.0-rc4-candidate made an 11-of-23-asset release the
          # answer to /releases/latest, and would have moved the `latest` image tag with it.
          if [[ "$VERSION" == *-candidate ]]; then
            echo "IS_CANDIDATE=true"  >> $GITHUB_OUTPUT
          else
            echo "IS_CANDIDATE=false" >> $GITHUB_OUTPUT
          fi

      - name: Build distribution archives (macOS)
        run: |
          chmod +x aether/dist/build-dist.sh
          aether/dist/build-dist.sh --version ${{ steps.version.outputs.VERSION }}

      - name: Stage dry-run assets
        if: github.event_name != 'push'
        run: |
          mkdir dryrun-assets
          cp aether/dist/output/*.tar.gz aether/dist/output/*.zip dryrun-assets/

      - name: Keep dry-run assets as a workflow artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v6
        with:
          name: dryrun-assets-macos
          if-no-files-found: error
          path: dryrun-assets/*
          retention-days: 3

      - name: Upload macOS archives to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            aether/dist/output/*.tar.gz
            aether/dist/output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build Linux arm64 archives on a native ARM runner
  build-linux-arm64-dist:
    runs-on: ubuntu-24.04-arm
    needs: build-and-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Extract version from tag
        id: version
        env:
          DRY_RUN_VERSION: ${{ inputs.version || '0.0.0-dryrun' }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          [[ "$GITHUB_EVENT_NAME" == push ]] || VERSION="$DRY_RUN_VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # A `-candidate` tag marks the artifact UNDER TEST. Neither the `latest` image tag nor
          # the GitHub "Latest release" pointer may follow it: doing so aims every un-pinned
          # `docker pull` and every install script at a build that has not been smoke-tested.
          # Measured 2026-09-09: pushing v1.0.0-rc4-candidate made an 11-of-23-asset release the
          # answer to /releases/latest, and would have moved the `latest` image tag with it.
          if [[ "$VERSION" == *-candidate ]]; then
            echo "IS_CANDIDATE=true"  >> $GITHUB_OUTPUT
          else
            echo "IS_CANDIDATE=false" >> $GITHUB_OUTPUT
          fi

      - name: Bootstrap jbct-maven-plugin and slice-processor
        run: mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor -am

      - name: Build all packages
        run: mvn package -B -DskipTests

      - name: Build distribution archives (linux-arm64)
        run: |
          chmod +x aether/dist/build-dist.sh
          aether/dist/build-dist.sh --version ${{ steps.version.outputs.VERSION }}

      - name: Stage dry-run assets
        if: github.event_name != 'push'
        run: |
          mkdir dryrun-assets
          cp aether/dist/output/*.tar.gz aether/dist/output/*.zip dryrun-assets/

      - name: Keep dry-run assets as a workflow artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v6
        with:
          name: dryrun-assets-linux-arm64
          if-no-files-found: error
          path: dryrun-assets/*
          retention-days: 3

      - name: Upload arm64 archives to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            aether/dist/output/*.tar.gz
            aether/dist/output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # #2235: SHA256SUMS is produced HERE, after the last asset exists. The archives come from three jobs (linux-amd64, macOS, linux-arm64),
  # so a sums file generated beside the first job could only ever cover that job's files (rc4: 4 of 23 assets, under build paths).
  # The expected set is what the release publishes (`gh release view`), not what this job believes it built.
  release-checksums:
    runs-on: ubuntu-latest
    needs: [build-and-release, build-macos-dist, build-linux-arm64-dist]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Dry run: the same generate and verify over the assets the three jobs kept as artifacts; nothing is read from or written to a release.
      - name: Download dry-run assets
        if: github.event_name != 'push'
        uses: actions/download-artifact@v6
        with:
          pattern: dryrun-assets-*
          merge-multiple: true
          path: release-assets

      - name: Generate and verify SHA256SUMS (dry run)
        if: github.event_name != 'push'
        run: |
          ls release-assets > assembled.txt
          scripts/release-checksums.sh generate release-assets
          scripts/release-checksums.sh verify release-assets assembled.txt

      - name: Generate SHA256SUMS over every published asset
        if: github.event_name == 'push'
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > published.txt
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*' --clobber
          scripts/release-checksums.sh generate release-assets
          scripts/release-checksums.sh verify release-assets published.txt

      - name: Upload SHA256SUMS
        if: github.event_name == 'push'
        run: gh release upload "$GITHUB_REF_NAME" release-assets/SHA256SUMS --clobber

      # Re-read the release as a user would: fresh download of every published asset, the sums file included.
      - name: Verify the published release
        if: github.event_name == 'push'
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > published-after.txt
          grep -x -F SHA256SUMS published-after.txt
          mkdir published-check
          gh release download "$GITHUB_REF_NAME" --dir published-check --pattern '*' --clobber
          scripts/release-checksums.sh verify published-check published-after.txt

  docker-publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-and-release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version from tag
        id: version
        env:
          DRY_RUN_VERSION: ${{ inputs.version || '0.0.0-dryrun' }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          [[ "$GITHUB_EVENT_NAME" == push ]] || VERSION="$DRY_RUN_VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # A `-candidate` tag marks the artifact UNDER TEST. Neither the `latest` image tag nor
          # the GitHub "Latest release" pointer may follow it: doing so aims every un-pinned
          # `docker pull` and every install script at a build that has not been smoke-tested.
          # Measured 2026-09-09: pushing v1.0.0-rc4-candidate made an 11-of-23-asset release the
          # answer to /releases/latest, and would have moved the `latest` image tag with it.
          if [[ "$VERSION" == *-candidate ]]; then
            echo "IS_CANDIDATE=true"  >> $GITHUB_OUTPUT
          else
            echo "IS_CANDIDATE=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Bootstrap and build
        run: |
          mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor -am
          mvn package -B -DskipTests

      # #2007: check the image BEFORE it is pushed, so a broken image is never published. `[backup]` shells out to git and writes
      # /data/backups as the image's own user (`aether`, the Dockerfile's USER); either missing makes the restore BLOCKED.
      - name: Build aether-node for the pre-push check
        uses: docker/build-push-action@v7
        with:
          context: aether
          file: aether/docker/aether-node/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          tags: aether-node:pre-push-check

      - name: Check aether-node carries git and a writable backup directory
        run: |
          docker run --rm --entrypoint git aether-node:pre-push-check --version
          docker run --rm --entrypoint sh aether-node:pre-push-check -c 'test -w /data/backups'

      - name: Build and push aether-node
        uses: docker/build-push-action@v7
        with:
          context: aether
          file: aether/docker/aether-node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aether-node:${{ steps.version.outputs.VERSION }}
            ${{ steps.version.outputs.IS_CANDIDATE == 'false' && format('ghcr.io/{0}/aether-node:latest', github.repository_owner) || '' }}

      - name: Build and push aether-forge
        uses: docker/build-push-action@v7
        with:
          context: aether
          file: aether/docker/aether-forge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aether-forge:${{ steps.version.outputs.VERSION }}
            ${{ steps.version.outputs.IS_CANDIDATE == 'false' && format('ghcr.io/{0}/aether-forge:latest', github.repository_owner) || '' }}

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-release
    if: false # Disabled: Docker networking in CI prevents reliable consensus departure detection

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Install all artifacts
        run: mvn install -B -DskipTests

      - name: Run E2E tests
        run: mvn verify -B -Pwith-e2e -pl aether/e2e-tests -DskipE2ETests=false
        timeout-minutes: 15

      - name: Run Forge tests
        run: mvn verify -B -Pwith-e2e -pl aether/forge/forge-tests
        timeout-minutes: 15

      - name: Upload E2E test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-test-results
          if-no-files-found: error
          path: |
            aether/e2e-tests/target/failsafe-reports/*.xml
            aether/forge/forge-tests/target/failsafe-reports/*.xml
          retention-days: 7
