name: Hierarchy runtime acceptance

# Expensive runtime coverage is explicit for code-only PRs and automatic for acceptance changes
# after merge. Foundation-only branches contain no such job and cannot report a partial pass.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, 'release-*']
    paths:
      - 'aether/forge/forge-tests/src/test/java/org/pragmatica/aether/forge/Hierarch*.java'
      - 'tools/check-hierarchy-selection.py'
      - 'tools/test_hierarchy_selection.py'
      - '.github/workflows/hierarchy-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-acceptance:
    # Labels opt code-only PRs into this expensive matrix; unrelated labels do not rerun it.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run-hierarchy') &&
       (github.event.action != 'labeled' || github.event.label.name == 'run-hierarchy'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: hierarchy-runtime-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      HIERARCHY_TESTS: HierarchyAuthorityAcceptanceTest,HierarchicalDecisionReplayTest,HierarchicalLeaderObservationGraceTest,HierarchicalWorkerRuntimeReplayTest,HierarchicalWorkerReconnectTest,HierarchicalRecoveryEnvelopeTest,HierarchicalMetadataRecoveryTest,HierarchicalGovernorReportLossTest,HierarchicalGovernorConcurrencyRestartTest,HierarchicalWorkerFormationTest,HierarchicalCoreRestartTest,HierarchicalCoreResizeTest,HierarchicalWorkerDrainTest,HierarchicalLoadedMovementTest,HierarchicalMovementTakeoverTest,HierarchicalCapacityFallbackTest,HierarchicalCommunityMovementTest,HierarchicalWorkerWorkloadTest,EmberAddNodeRoleLabelTest,ClusterFormationTest,StreamOwnershipDriverFenceTest,SliceInvocationTest,DeclarativeStreamConsumerTest,DurableProjectionRebuildForgeTest
    steps:
      - uses: actions/checkout@v5
      - name: Verify complete selection before building
        run: |
          python3 -B -m unittest discover -s tools -p test_hierarchy_selection.py
          python3 tools/check-hierarchy-selection.py "$HIERARCHY_TESTS"
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu
          cache: maven
      - name: Record tested merge and PR revisions
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p target/hierarchy-evidence
          git rev-parse HEAD > target/hierarchy-evidence/merge-sha.txt
          printf '%s\n' "$PR_HEAD" > target/hierarchy-evidence/pr-head-sha.txt
          uname -a > target/hierarchy-evidence/runner.txt
          lscpu > target/hierarchy-evidence/cpu.txt
          free -b > target/hierarchy-evidence/memory.txt
          java -version 2> target/hierarchy-evidence/java.txt
      - name: Build runtime and Forge fixtures
        run: env -u HCLOUD_TOKEN ./build.sh
      - name: Run hierarchy correctness and recovery acceptance
        run: env -u HCLOUD_TOKEN ./forge.sh "$HIERARCHY_TESTS"
      - name: Verify every selected class executed without skips
        run: python3 tools/check-hierarchy-selection.py "$HIERARCHY_TESTS" --reports aether/forge/forge-tests/target/failsafe-reports
      - name: Collect measured envelope records
        if: always()
        run: |
          mkdir -p target/hierarchy-evidence
          python3 - <<'PY'
          import glob, json, xml.etree.ElementTree as ET
          records = []
          reconnect = []
          for path in glob.glob("aether/forge/forge-tests/target/failsafe-reports/TEST-*.xml"):
              for output in ET.parse(path).iter("system-out"):
                  for line in (output.text or "").splitlines():
                      if line.startswith("HIERARCHY_ENVELOPE "):
                          records.append(json.loads(line.removeprefix("HIERARCHY_ENVELOPE ")))
                      elif line.startswith("HIERARCHY_RECONNECT "):
                          reconnect.append(line)
          with open("target/hierarchy-evidence/envelope.json", "w") as output:
              json.dump(records, output, indent=2)
          with open("target/hierarchy-evidence/reconnect.txt", "w") as output:
              output.write("\n".join(reconnect) + "\n")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hierarchy-runtime-evidence
          path: |
            target/hierarchy-evidence/**
            aether/forge/forge-tests/target/failsafe-reports/**
            aether/forge/forge-tests/target/hierarchy-envelope/**
