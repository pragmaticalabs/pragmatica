name: Hierarchy review acceptance

on:
  pull_request:
    branches: [release-*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-mutations:
    if: github.head_ref == 'feat/hierarchy-primitives-rc4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu
          cache: maven
      - name: Bootstrap processors
        run: mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor,aether/pg-tools/pg-codegen -am
      - name: Install foundation dependencies
        run: mvn install -B -DskipTests -pl integrations/cluster -am
      - name: Prove regression sensitivity
        run: python3 tools/check-hierarchy-foundation-mutations.py
      - name: Verify restored implementation
        if: always()
        run: mvn test -B -pl integrations/cluster -Dtest='KVStore*Test'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: foundation-mutation-evidence
          path: |
            target/hierarchy-mutations/**
            integrations/cluster/target/surefire-reports/**

  runtime-acceptance:
    if: github.head_ref == 'feat/hierarchy-runtime-rc4'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu
          cache: maven
      - name: Record tested merge and PR revisions
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p target/hierarchy-evidence
          git rev-parse HEAD > target/hierarchy-evidence/merge-sha.txt
          printf '%s\n' "$PR_HEAD" > target/hierarchy-evidence/pr-head-sha.txt
          uname -a > target/hierarchy-evidence/runner.txt
          lscpu > target/hierarchy-evidence/cpu.txt
          free -b > target/hierarchy-evidence/memory.txt
          java -version 2> target/hierarchy-evidence/java.txt
      - name: Build runtime and Forge fixtures
        run: env -u HCLOUD_TOKEN ./build.sh
      - name: Run hierarchy correctness and recovery acceptance
        run: >-
          env -u HCLOUD_TOKEN ./forge.sh
          'HierarchyAuthorityAcceptanceTest,HierarchicalDecisionReplayTest,HierarchicalLeaderObservationGraceTest,HierarchicalWorkerRuntimeReplayTest,HierarchicalWorkerReconnectTest,HierarchicalRecoveryEnvelopeTest,HierarchicalMetadataRecoveryTest,HierarchicalGovernorReportLossTest,HierarchicalGovernorConcurrencyRestartTest,HierarchicalWorkerFormationTest,HierarchicalCoreRestartTest,HierarchicalCoreResizeTest,HierarchicalWorkerDrainTest,HierarchicalLoadedMovementTest,HierarchicalMovementTakeoverTest,HierarchicalCapacityFallbackTest,HierarchicalCommunityMovementTest,HierarchicalWorkerWorkloadTest,EmberAddNodeRoleLabelTest,ClusterFormationTest,StreamOwnershipDriverFenceTest,SliceInvocationTest'
      - name: Collect measured envelope records
        if: always()
        run: |
          mkdir -p target/hierarchy-evidence
          python3 - <<'PY'
          import glob, json, xml.etree.ElementTree as ET
          records = []
          reconnect = []
          for path in glob.glob("aether/forge/forge-tests/target/failsafe-reports/TEST-*.xml"):
              for output in ET.parse(path).iter("system-out"):
                  for line in (output.text or "").splitlines():
                      if line.startswith("HIERARCHY_ENVELOPE "):
                          records.append(json.loads(line.removeprefix("HIERARCHY_ENVELOPE ")))
                      elif line.startswith("HIERARCHY_RECONNECT "):
                          reconnect.append(line)
          with open("target/hierarchy-evidence/envelope.json", "w") as output:
              json.dump(records, output, indent=2)
          with open("target/hierarchy-evidence/reconnect.txt", "w") as output:
              output.write("\n".join(reconnect) + "\n")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hierarchy-runtime-evidence
          path: |
            target/hierarchy-evidence/**
            aether/forge/forge-tests/target/failsafe-reports/**
            aether/forge/forge-tests/target/hierarchy-envelope/**
