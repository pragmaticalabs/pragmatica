name: Hierarchy review acceptance

on:
  pull_request:
    paths:
      - 'aether/**'
      - 'integrations/cluster/**'
      - 'integrations/consensus/**'
      - 'integrations/serialization/**'
      - 'core/**'
      - 'tools/check-hierarchy-foundation-mutations.py'
      - '.github/workflows/hierarchy-review.yml'
      - 'pom.xml'
  push:
    branches: [main, 'release-*']
    paths:
      - 'aether/**'
      - 'integrations/cluster/**'
      - 'integrations/consensus/**'
      - 'integrations/serialization/**'
      - 'core/**'
      - 'tools/check-hierarchy-foundation-mutations.py'
      - '.github/workflows/hierarchy-review.yml'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu
          cache: maven
      - name: Bootstrap processors
        run: env -u HCLOUD_TOKEN mvn install -B -DskipTests -pl jbct/jbct-maven-plugin,jbct/slice-processor,aether/pg-tools/pg-codegen -am
      - name: Install foundation dependencies
        run: env -u HCLOUD_TOKEN mvn install -B -DskipTests -pl integrations/cluster -am
      - name: Prove regression sensitivity
        run: python3 tools/check-hierarchy-foundation-mutations.py
      - name: Verify restored implementation
        if: always()
        run: env -u HCLOUD_TOKEN mvn test -B -pl integrations/cluster -Dtest='KVStore*Test'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: foundation-mutation-evidence
          path: |
            target/hierarchy-mutations/**
            integrations/cluster/target/surefire-reports/**
