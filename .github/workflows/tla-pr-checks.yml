# Checks on a pull request that the embedded TLA+ models (tools/tla/README.md) still describe the code.
#  - fragment-touched: fails when a changed line of code falls inside a region (method, field, declaration) documented by a
#    `tla <Module>:<Part>` fragment and that fragment's text is unchanged. Excused per module by a line
#    `tla-unchanged: <Module>: <reason>` in the PR body (editing the body re-runs the check).
#  - evidence-rows: fails when a row the PR adds to tools/tla/results.tsv (run.sh's evidence rows) is malformed, was made on a
#    dirty tree, or names a commit that is not an ancestor of the PR head. A PR that adds no rows passes.
#  - fragment-paths: fails when the `paths:` list of tla-models.yml (generated by tools/tla/fragment-paths.py --sync) misses a
#    Java file that carries a `tla` fragment, lists a file that carries none, or when a model module with fragments has no
#    row in models.tsv (it would never be model-checked). No TLC: a few seconds. Without it a PR that gave a file its first
#    fragment, or added a module, without running --sync was green at PR time and the models never ran for that file.
# Required checks are a repository ruleset edit, the owner's: contexts `fragment-touched` and `fragment-paths` (README, "Making
# the PR checks required"). Two properties make them fit to be required:
#  1. The merge queue. Every job also runs on `merge_group`, where a required context must report or the queue waits for it
#     forever (the squash commit of each queued PR is the unit judged, see each job).
#  2. The instrument comes from the BASE. The scripts and their self-tests are read from the base branch's tools/tla (git archive
#     of the base revision into a temp dir) and run against the PR's tree, so a branch older than the instrument cannot lack it
#     (#3605: "NO TESTS RAN", a check that said nothing about the PR) and a PR cannot edit the judge that judges it. When the PR
#     itself changes tools/tla/*.py (or its fixtures), the head's own copy and tests ALSO run, so a PR that breaks the tooling
#     is red. An instrument the base lacks fails with one `INSTRUMENT ABSENT:` line, never as exit 5 or a pass.
# Not covered: this workflow file itself comes from the PR's own merge commit, so a PR can still edit it; a ruleset `workflows`
# rule or CODEOWNERS on .github/workflows is what would close that, and is the owner's.
name: TLA+ PR checks

on:
  pull_request:
    branches:
      - 'release-*'
    types: [opened, synchronize, reopened, edited]
  # Merge queue (squash, rc6 ruleset): a required context must be produced on the queue's temporary branch.
  merge_group:
    branches:
      - 'release-*'

permissions:
  contents: read
  pull-requests: read   # merge_group: the body of each queued PR carries its tla-unchanged excuses

# A newer run on the same PR supersedes the in-progress one. A merge_group run takes the sha group and is never cancelled (the
# PR number is empty there: a shared group would cancel one queued group's run with another's).
concurrency:
  group: tla-pr-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The revision the instrument is read from and the PR/queue entry is judged against: the base branch's tip for a pull
  # request, the commit the merge group is built on for a merge_group.
  BASE_REV: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
  BASE_NAME: ${{ github.base_ref || github.event.merge_group.base_ref }}

jobs:
  fragment-touched:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout, full history because the check reads the merge base
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # INSTRUMENT-STEP (identical in the three jobs; test_workflow.py compares the text)
      - name: Instrument from the base
        env:
          NEED: touched.py extract.py test_touched.py
        run: |
          set -euo pipefail
          inst="$RUNNER_TEMP/tla-base"
          rm -rf "$inst"; mkdir -p "$inst"
          git archive "$BASE_REV" tools/tla | tar -x -C "$inst"
          for f in $NEED; do
            [ -f "$inst/tools/tla/$f" ] || { echo "INSTRUMENT ABSENT: tools/tla/$f in $BASE_REV; the base itself lacks it, no judgement is possible"; exit 1; }
          done
          mb="$(git merge-base "$BASE_REV" HEAD)"
          own=0
          [ -z "$(git diff --name-only "$mb" HEAD -- 'tools/tla/*.py' tools/tla/fixtures)" ] || own=1
          echo "TLA_INST=$inst" >> "$GITHUB_ENV"
          echo "TLA_HEAD_OWN=$own" >> "$GITHUB_ENV"
          echo "instrument: $NEED read from $BASE_REV (merge base $mb); this change edits tools/tla scripts: $own"

      - name: Fragment-touched self-test, the base's
        run: python3 -m unittest discover -s "$TLA_INST/tools/tla" -p 'test_touched.py' -v

      - name: Fragment-touched self-test, the head's (this change edits tools/tla scripts)
        if: env.TLA_HEAD_OWN == '1'
        run: |
          [ -f tools/tla/test_touched.py ] || { echo "head has no tools/tla/test_touched.py: the base's judged"; exit 0; }
          python3 -m unittest discover -s tools/tla -p 'test_touched.py' -v

      # pull_request: the PR head against the base, the excuses read from the PR body. merge_group: there is no PR body, and
      # the group head is the base plus the queued PRs, which is not in general the tree the PR event judged (a PR queued
      # behind another lands on a different base). So the check RE-RUNS on every queued squash commit (first parent chain
      # base..head), commit^1..commit, with the excuses of the PR that commit names in its subject `(#N)` read from that PR's
      # body. A commit that names no PR is judged without excuse. Each queued PR is judged by its own patch on its real parent.
      - name: Code under a tla fragment changed without its fragment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          bodies="$RUNNER_TEMP/tla-bodies"; rm -rf "$bodies"; mkdir -p "$bodies"
          units="$RUNNER_TEMP/tla-units"; : > "$units"
          if [ "$EVENT" = merge_group ]; then
            commits="$(git rev-list --first-parent --reverse "$BASE_REV..HEAD")"
            [ -n "$commits" ] || { echo "touched: ERROR the merge group holds no commit over $BASE_REV: nothing was examined" >&2; exit 2; }
            for c in $commits; do
              pr="$(git log -1 --format=%s "$c" | sed -nE 's/.*\(#([0-9]+)\)[[:space:]]*$/\1/p')"
              if [ -n "$pr" ]; then
                gh api "repos/$GH_REPO/pulls/$pr" --jq '.body // ""' > "$bodies/$c"
                echo "queued $c is PR #$pr ($(wc -c < "$bodies/$c" | tr -d ' ') body bytes read for tla-unchanged excuses)"
              else
                : > "$bodies/$c"
                echo "NOTE queued $c names no PR in its subject: judged without any tla-unchanged excuse"
              fi
              echo "$c^1 $c $bodies/$c" >> "$units"
            done
          else
            printf '%s' "$PR_BODY" > "$bodies/pr"
            echo "$BASE_REV HEAD $bodies/pr" >> "$units"
          fi
          judges="$TLA_INST/tools/tla/touched.py"
          if [ "${TLA_HEAD_OWN:-0}" = 1 ] && [ -f tools/tla/touched.py ]; then judges="$judges tools/tla/touched.py"; fi
          rc=0
          while read -r b h f; do
            for judge in $judges; do
              echo "== $judge --base $b --head $h"
              python3 "$judge" --base "$b" --head "$h" --pr-body-file "$f" || rc=$?
            done
          done < "$units"
          exit "$rc"

  evidence-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout, full history because the check reads ancestry and the merge base
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # merge_group: the rows name commits of the PR's own branch, which a squash merge drops from the history, so the ancestry
      # the check verifies no longer exists on the queue's commit. Stated, not skipped: a skipped required job reads as success.
      - name: Merge queue - evidence rows verified on the pull request
        if: github.event_name == 'merge_group'
        run: echo "evidence rows not re-checked on merge_group (a squash drops the PR commits their ancestry is checked against); the pull_request run of this check judged them"

      # INSTRUMENT-STEP (identical in the three jobs; test_workflow.py compares the text)
      - name: Instrument from the base
        if: github.event_name == 'pull_request'
        env:
          NEED: results-check.py test_results_check.py
        run: |
          set -euo pipefail
          inst="$RUNNER_TEMP/tla-base"
          rm -rf "$inst"; mkdir -p "$inst"
          git archive "$BASE_REV" tools/tla | tar -x -C "$inst"
          for f in $NEED; do
            [ -f "$inst/tools/tla/$f" ] || { echo "INSTRUMENT ABSENT: tools/tla/$f in $BASE_REV; the base itself lacks it, no judgement is possible"; exit 1; }
          done
          mb="$(git merge-base "$BASE_REV" HEAD)"
          own=0
          [ -z "$(git diff --name-only "$mb" HEAD -- 'tools/tla/*.py' tools/tla/fixtures)" ] || own=1
          echo "TLA_INST=$inst" >> "$GITHUB_ENV"
          echo "TLA_HEAD_OWN=$own" >> "$GITHUB_ENV"
          echo "instrument: $NEED read from $BASE_REV (merge base $mb); this change edits tools/tla scripts: $own"

      - name: Evidence-row check self-test, the base's
        if: github.event_name == 'pull_request'
        run: python3 -m unittest discover -s "$TLA_INST/tools/tla" -p 'test_results_check.py' -v

      - name: Evidence-row check self-test, the head's (this change edits tools/tla scripts)
        if: github.event_name == 'pull_request' && env.TLA_HEAD_OWN == '1'
        run: |
          [ -f tools/tla/test_results_check.py ] || { echo "head has no tools/tla/test_results_check.py: the base's judged"; exit 0; }
          python3 -m unittest discover -s tools/tla -p 'test_results_check.py' -v

      - name: Rows added by this PR name commits behind its head
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          rc=0
          python3 "$TLA_INST/tools/tla/results-check.py" --base "$BASE_REV" --head HEAD || rc=$?
          if [ "${TLA_HEAD_OWN:-0}" = 1 ] && [ -f tools/tla/results-check.py ]; then
            python3 tools/tla/results-check.py --base "$BASE_REV" --head HEAD || rc=$?
          fi
          exit "$rc"

  fragment-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout, full history because the instrument check reads the merge base
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # INSTRUMENT-STEP (identical in the three jobs; test_workflow.py compares the text)
      - name: Instrument from the base
        env:
          NEED: fragment-paths.py extract.py test_fragment_paths.py
        run: |
          set -euo pipefail
          inst="$RUNNER_TEMP/tla-base"
          rm -rf "$inst"; mkdir -p "$inst"
          git archive "$BASE_REV" tools/tla | tar -x -C "$inst"
          for f in $NEED; do
            [ -f "$inst/tools/tla/$f" ] || { echo "INSTRUMENT ABSENT: tools/tla/$f in $BASE_REV; the base itself lacks it, no judgement is possible"; exit 1; }
          done
          mb="$(git merge-base "$BASE_REV" HEAD)"
          own=0
          [ -z "$(git diff --name-only "$mb" HEAD -- 'tools/tla/*.py' tools/tla/fixtures)" ] || own=1
          echo "TLA_INST=$inst" >> "$GITHUB_ENV"
          echo "TLA_HEAD_OWN=$own" >> "$GITHUB_ENV"
          echo "instrument: $NEED read from $BASE_REV (merge base $mb); this change edits tools/tla scripts: $own"

      # What this check judges is the tree itself (the paths list against the Java files, models.tsv against the modules, the
      # workflows against each other), with no PR body and no diff, so on a merge_group it runs unchanged on the queue's commit:
      # the tree that will actually be merged, which is the point of a queue.
      - name: Fragment-paths self-test, the base's
        run: python3 -m unittest discover -s "$TLA_INST/tools/tla" -p 'test_fragment_paths.py' -v

      - name: Fragment-paths self-test, the head's (this change edits tools/tla scripts)
        if: env.TLA_HEAD_OWN == '1'
        run: |
          [ -f tools/tla/test_fragment_paths.py ] || { echo "head has no tools/tla/test_fragment_paths.py: the base's judged"; exit 0; }
          python3 -m unittest discover -s tools/tla -p 'test_fragment_paths.py' -v

      # test_workflow.py reads this tree's workflows, README and scripts against each other, so it is the head's (a legitimate
      # change to a profile or the jar pin edits it in the same PR). A branch too old to carry it is told to merge the base.
      - name: Workflow wiring self-test
        run: |
          [ -f tools/tla/test_workflow.py ] || { echo "INSTRUMENT ABSENT: tools/tla/test_workflow.py; merge ${BASE_NAME#refs/heads/} into this branch"; exit 1; }
          python3 -m unittest discover -s tools/tla -p 'test_workflow.py' -v

      - name: Paths list of tla-models.yml and models.tsv cover every model
        run: |
          set -euo pipefail
          rc=0
          python3 "$TLA_INST/tools/tla/fragment-paths.py" --check --base . --workflow .github/workflows/tla-models.yml --models tools/tla/models.tsv || rc=$?
          if [ "${TLA_HEAD_OWN:-0}" = 1 ] && [ -f tools/tla/fragment-paths.py ]; then
            python3 tools/tla/fragment-paths.py --check || rc=$?
          fi
          exit "$rc"
