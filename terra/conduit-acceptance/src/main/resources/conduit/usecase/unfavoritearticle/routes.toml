prefix = "/api"

[security]
default = "authenticated"

[routes]
execute = { route = "DELETE /articles/{slug}/favorite", status = 200 }

[errors]
packages = ["conduit.domain"]
default = 500
HTTP_401 = ["Unauthorized"]
HTTP_403 = ["Forbidden"]
HTTP_404 = ["NotFound"]
HTTP_409 = ["Conflict"]
HTTP_422 = ["RequestInvalid"]
