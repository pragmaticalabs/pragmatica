prefix = "/api"

[security]
default = "optional"

[routes]
execute = { route = "GET /articles/{slug}/comments", status = 200 }

[errors]
packages = ["conduit.domain"]
default = 500
HTTP_401 = ["Unauthorized"]
HTTP_403 = ["Forbidden"]
HTTP_404 = ["NotFound"]
HTTP_409 = ["Conflict"]
HTTP_422 = ["RequestInvalid"]
