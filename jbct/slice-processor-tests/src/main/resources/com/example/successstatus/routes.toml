prefix = "/api/blog"

[routes]
create = { route = "POST /articles", status = 201, location = "/api/blog/articles/{slug}" }
register = { route = "POST /registrations", status = 201 }
draft = { route = "POST /drafts", status = 201, location = "/api/blog/drafts/{id}" }
enqueue = { route = "POST /jobs", status = 202 }
remove = "DELETE /articles/{slug}"
find = "GET /articles/{slug}"
broken = "GET /broken"

[errors]
default = 500
