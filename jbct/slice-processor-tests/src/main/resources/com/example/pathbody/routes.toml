nested = "PUT /nested/{id}"
envelope = "POST /envelope"
optNote = "PUT /opt-note/{id}"
patchNote = "PUT /patch-note/{id}"
listNote = "PUT /list-note/{id}"
mapNote = "PUT /map-note/{id}"
listedNote = "PUT /listed/{id}"
