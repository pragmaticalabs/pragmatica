prefix = "/api/v1/test"

[routes]
create = "POST /"
getById = "GET /{id:Long}"
getItem = "GET /orders/{orderId:Long}/items/{itemId:Long}"
getItemImage = { route = "GET /items/{id:Long}/image", produces = "application/octet-stream" }
search = "GET /search?query&limit:Integer&offset:Integer"
update = "PUT /{id:Long}"
getOrders = "GET /{userId:Long}/orders?status&limit:Integer"
health = "GET /health"
exportCsv = { route = "GET /export/{id:Long}", produces = "text/csv" }
download = { route = "GET /download/{id:Long}", produces = "application/octet-stream" }
uploadText = { route = "POST /upload-text", consumes = "text/plain", max_size = "1MB" }
uploadForm = { route = "POST /upload-form", consumes = "multipart/form-data", max_size = "50MB", max_duration = "30m" }
uploadBlob = { route = "POST /upload-blob", consumes = "application/octet-stream" }

[errors]
default = 500
HTTP_404 = ["*NotFound*"]
HTTP_400 = ["*Invalid*"]
HTTP_409 = ["*Duplicate*"]
