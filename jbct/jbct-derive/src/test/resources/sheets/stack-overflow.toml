schema_version = "0.1"

# Stack Overflow (2016 configuration) — answer sheet in schema form (issue #443 Phase A golden).
#
# PROVENANCE: transcribed from derivation-artifacts/runs/stack-overflow/ANSWER-SHEET.md (Grade B).
# The artifacts repo publishes this run only in PROSE (a 10-item list); this TOML transcription
# maps those demands onto the nine questions. Its site-wide failure stance is scoped to the
# effectful write path (post-content) per the book's per-operation failure budget; genuinely
# absent demands are marked UNKNOWN.

[meta]
system = "stack-overflow"
era    = "2013-2016"
author = "transcription"
date   = "2026-07-12"
mode   = "greenfield"

# ---- Q1 Time budget ----
[[answers.q1]]
scope     = "path:page-render"
statement = "50ms render budget targeted; 2016 actuals 22.71ms on question pages, 11.80ms on the homepage"
shape     = "system-clock"
price     = "server render time is the product's felt speed; slow render loses engagement"
status    = "answered"
source    = "Arch-2016; 2013"

# ---- Q2 Failure budget ----
[[answers.q2]]
scope     = "operation:post-content"
statement = "No published SLA; a move-fast stance; routine deploys take 2 of 9 web servers offline and full-DC failover drills run roughly every 2 months"
basis     = "target"
price     = "deliberately accepts brief user-visible disruption during deploys and failover drills"
status    = "answered"
source    = "HS-2014; Deploy-2016"

# ---- Q3 Loss budget ----
[[answers.q3]]
scope     = "data-class:posts"
statement = "SQL is the single source of truth; all replicas including DR are asynchronous, so datacenter loss carries an accepted RPO greater than zero"
status    = "answered"
source    = "Arch-2016"

# ---- Q4 Consistency contract ----
[[answers.q4]]
scope     = "data-class:posts"
statement = "SQL single source of truth; logged-in pages rendered real-time; caching only for anonymous users; async replicas everywhere"
status    = "answered"
source    = "Arch-2016; HS-2014"

# ---- Q5 Load ----
[[answers.q5]]
scope     = "path:page-render"
statement = "About 209M HTTP requests a day and 66M page loads a day (Feb 2016); weekday peaks of 2,600 to 3,000 requests per second"
shape     = "volume"
status    = "answered"
source    = "Arch-2016; HS-2014"

[[answers.q5]]
scope     = "path:full-text-search"
statement = "17.2M searches a day offloaded to Elasticsearch because SQL CPUs are comparatively very expensive and Elastic is cheap"
shape     = "volume"
status    = "answered"
source    = "Arch-2016"

[[answers.q5]]
scope     = "path:tag-match"
statement = "3.66M requests a day served from a huge in-memory struct array optimized for SO use cases; index reload takes about 2 minutes"
shape     = "contention"
status    = "answered"
source    = "HS-2014; Arch-2016"

[[answers.q5]]
scope     = "path:realtime-updates"
statement = "About 500K concurrent websockets at peak; Redis serves 5.8B hits a day below 2% CPU"
shape     = "contention"
status    = "answered"
source    = "Arch-2016"

# ---- Q6 External constraints ----
[[answers.q6]]
scope     = "system"
statement = "No compliance, audit, or replay statements appear in any source (absence noted, not inferred)"
status    = "UNKNOWN"
source    = "absence in sources"

# ---- Q7 Release structure ----
[[answers.q7]]
scope     = "system"
statement = "About 15 people push to the repo; 5 to 10 production deploys a day; full deploy under 9 minutes on one uniform train"
status    = "answered"
source    = "Deploy-2016; HS-2014"

# ---- Q8 Cost & capacity envelope ----
[[answers.q8]]
scope     = "system"
statement = "Hardware is cheaper than developers and efficient code; the web tier runs at 5 to 15% CPU; cloud specs are not available at reasonable prices"
status    = "answered"
source    = "2013; HS-2014"

# ---- Q9 Multi-X ----
[[answers.q9]]
scope     = "system"
statement = "NY primary plus Colorado DR over 10Gbps MPLS; serves the world from one datacenter; no residency constraints published"
status    = "answered"
source    = "Arch-2016"

# ---- Domain-shape facts ----
[[domain_shape]]
operation   = "post-content"
inverse     = "edit or soft-delete a post; history preserved"
decays      = false
reshapeable = ["append-only"]

# ---- Change-driver facts ----
[[change_drivers]]
scope      = "policy:content-model"
volatility = "rare"
source     = "stable Q&A domain"
