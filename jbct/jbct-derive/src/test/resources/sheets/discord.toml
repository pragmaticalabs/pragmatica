schema_version = "0.1"

# Discord (messages / read path, 2017-2023) — answer sheet in schema form (issue #443 Phase A golden).
#
# PROVENANCE: transcribed from derivation-artifacts/runs/discord/ANSWER-SHEET.md (Grade C —
# registered-but-contaminated-adjacent). The artifacts repo publishes this run only in PROSE (a
# 10-item list). The store-all-history-forever policy is transcribed as a product loss commitment
# (never_lose), and the absence of compliance mandates is recorded as UNKNOWN, not inferred.

[meta]
system = "discord"
era    = "2017-2023"
author = "transcription"
date   = "2026-07-12"
mode   = "greenfield"

# ---- Q1 Time budget ----
[[answers.q1]]
scope     = "path:read-messages"
statement = "Reads should be super snappy, under 5ms; read latency has the biggest impact on the product"
shape     = "system-clock"
price     = "slow reads degrade the core chat experience directly"
status    = "answered"
source    = "B17; ND22; RS20"

[[answers.q1]]
scope     = "operation:send-message"
statement = "Writes should be sub-millisecond; the API p95 alert fires at 80ms"
shape     = "requester-clock"
price     = "a sender waits on the write before the message appears; slow writes feel laggy"
status    = "answered"
source    = "B17"

# ---- Q2 Failure budget ----
[[answers.q2]]
scope     = "operation:send-message"
statement = "Self-heal as much as possible and tolerate a loss of nodes; high-toil paging is named as a failure to design out"
basis     = "target"
price     = "with only a tiny ops team, manual recovery toil is itself the failure to avoid"
status    = "answered"
source    = "B17; T23"

# ---- Q3 Loss budget ----
[[answers.q3]]
scope     = "data-class:messages"
statement = "Store all chat history forever — messages are never to be lost; trillions are already stored"
status    = "answered"
source    = "B17; T23"

# ---- Q4 Consistency contract ----
[[answers.q4]]
scope     = "data-class:messages"
statement = "Availability is explicitly preferred over strong consistency for messages; last-write-wins per column; per-channel ordering via chronologically sortable Snowflake IDs"
status    = "answered"
source    = "B17; T23"

# ---- Q5 Load ----
[[answers.q5]]
scope     = "path:read-messages"
statement = "4B messages a day and about 2M DB requests a second; disk ops around 1.25 to 1.5M reads a second versus 0.1M writes; reads are extremely random at roughly 50/50 store-level"
shape     = "volume"
status    = "answered"
source    = "ND22; B17"

[[answers.q5]]
scope     = "path:read-messages"
statement = "Hot recency in big channels — requesting messages sent in the last hour, often — and concurrent reads can hotspot a partition"
shape     = "contention"
status    = "answered"
source    = "B17; T23"

[[answers.q5]]
scope     = "path:presence-fanout"
statement = "5M concurrent websockets and millions of events a second; big-guild presence fan-out ran 900ms to 2.1s before optimization with 30K concurrent users in one guild"
shape     = "burst"
status    = "answered"
source    = "EX17"

# ---- Q6 External constraints ----
[[answers.q6]]
scope     = "system"
statement = "No compliance or audit statements appear in any source; the store-history-forever policy is voluntary product identity, not a mandate"
status    = "UNKNOWN"
source    = "absence in sources"

# ---- Q7 Release structure ----
[[answers.q7]]
scope     = "system"
statement = "Linear scalability is wanted — no manual re-sharding — and the system should self-heal to reduce operational toil"
status    = "answered"
source    = "B17"

# ---- Q8 Cost & capacity envelope ----
[[answers.q8]]
scope     = "system"
statement = "Only 4 backend engineers and no dedicated DevOps (2017) — a hard headcount bound"
status    = "answered"
source    = "B17"

# ---- Q9 Multi-X ----
[[answers.q9]]
scope     = "system"
statement = "Presence is ephemeral, re-derivable, and a massive fan-out; it is not a stored data class"
status    = "answered"
source    = "EX17"

# ---- Domain-shape facts ----
[[domain_shape]]
operation   = "send-message"
inverse     = "delete or edit a message"
decays      = false
reshapeable = ["append-only"]

# ---- Change-driver facts ----
[[change_drivers]]
scope      = "policy:message-retention"
volatility = "stable-product-commitment"
source     = "B17"
