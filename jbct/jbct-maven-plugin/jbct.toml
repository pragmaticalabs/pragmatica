# #3029: this module entered the CI JBCT gate. Format and every lint rule not listed here are enforced.
# The rules below are pinned to warning (visible, non-failing) for the stated reason, the same way the root
# jbct.toml pins CAUSE-01/02 (#720). Burn down by removing a line when its findings reach zero.

[lint.rules]
# EX-01: throws/throw mandated by the Maven Mojo, annotation-processor or Jackson APIs, or deliberate fixture throw; class-name match for CstNoBusinessExceptionsRule is a name-based false positive
JBCT-EX-01 = "warning"
# RET-01: void return mandated by the host API or inherent to mutable emit state (Mojo.execute, Processor.init, main, AutoCloseable.close, visitor callbacks); the signature is the API where it is not our choice
JBCT-RET-01 = "warning"
# RET-06: null-tolerant string/AST helpers; Option migration pending
JBCT-RET-06 = "warning"
