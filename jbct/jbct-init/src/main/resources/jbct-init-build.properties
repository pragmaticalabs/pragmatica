# Build stamp for jbct-init. The version value is injected by Maven resource filtering at build
# time (see jbct-init/pom.xml <resources> filtering), mirroring the slice-processor #403 staleness
# guard. Read at runtime by GitHubVersionResolver so version scaffolding self-derives the running
# binary's own version instead of a hand-maintained constant that can silently go stale.
version=${project.version}
