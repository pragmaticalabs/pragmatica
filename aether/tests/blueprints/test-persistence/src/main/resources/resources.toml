# Application-level (blueprint) resources for test-persistence.
#
# Packaged into the blueprint JAR as META-INF/resources.toml by the JBCT
# maven-plugin (GenerateBlueprintMojo / PackageBlueprintMojo). At deploy
# time, BlueprintService stores this content in the KV-Store under
# BlueprintResourcesKey(blueprintId); each node's slice loader then
# resolves @ResourceQualifier(config = "streams.test-events") lookups
# against this content.
#
# See @EventStreamPublisher and @EventStreamReader qualifiers in this
# project: both declare config = "streams.test-events".

[streams.test-events]
partitions = 4
retention = "time"
retention-value = "5m"
max-event-size = "64KB"

[database.testpersistence]
# Required by PersistenceSlice's PgSqlConnector qualifier (@TestPersistenceDb).
# NAMED datasource (#598): datasource names are cluster-global and the single-migrator
# gate keys on them — the bare `database` default raced url-shortener's claim when
# cluster-A suites ran in parallel. The name maps to schema/testpersistence/ and to
# this section; the URL points at this blueprint's OWN physical database because the
# schema history/owner tables are fixed-name-per-physical-database (a shared DB would
# re-create the collision at the owner-table level). The database is ensured by the
# harness preflight (docker/remote: forge-postgres init + ensure_pg_database; cloud:
# the [database.testpersistence] node_config section in env/cloud-hetzner*.toml).
# Values are overridden at deploy time ONLY by an exactly-matching node config
# section — the connector resolves config by full section name.
username = "forge"
password = "forge"
async_url = "postgresql://forge-postgres:5432/forge_testpersistence"

[scheduling.heartbeat]
# Fixed-rate interval — leader-only (default). Short period so suite 08's
# `test_task_last_execution_advances` observes a >0 lastExecutionAt soon
# after slice activation. Resolved by @Heartbeat (Scheduled qualifier).
# The slice processor emits a reactive manifest entry with category=scheduled,
# config=scheduling.heartbeat, method=heartbeat; the runtime publishes a
# ScheduledTaskKey to the cluster KV-Store on slice activation so the
# /api/scheduled-tasks Management API enumerates the task.
# `cron` must be present (even empty) because ProviderBasedConfigService's
# record-binding requires every component to be resolvable from TOML
# (it has no DEFAULT-field fallback for ScheduleConfig). Key naming is
# snake_case — the binder calls `toSnakeCase` on Java record component
# names before lookup, so `executionMode` becomes `execution_mode`.
interval = "10s"
cron = ""
execution_mode = "SINGLE"
