prefix = "/api/kv"

[security]
# Test fixture: public routes so integration tests can hit /api/kv without auth setup.
# Production slices should default to "authenticated" or stronger.
default = "public"
override_policy = "strengthen_only"

[routes]
get = "GET /{key}"
put = "PUT /{key}"
list = "GET /"
publish = "POST /publish"
read = "POST /stream"

[errors]
default = 500
HTTP_404 = ["*NotFound*"]
HTTP_400 = ["*Invalid*"]
