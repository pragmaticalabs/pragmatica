# Application-level (blueprint) resources for test-entity (#345 increments I0/I1).
#
# Packaged into the slice JAR as META-INF/resources.toml by the JBCT maven-plugin. It is NOT
# published to the KV-Store at deploy (BlueprintService.publish): each node's slice loader reads it
# from this jar alone as the slice-intrinsic config layer beneath the node composite, and resolves the
# @OrderEntity qualifier's `config = "entities.orders"` lookup against that layering (SliceStore).
# The deploy-time config-section pre-flight reads the same jar the same way (#1067).
#
# THIS IS THE FIRST DurableEntity RESOURCE DECLARATION IN THE REPOSITORY. Before it, nothing
# anywhere named a durable entity, so `resource/durable-entity` was unreachable from any running
# node and no build could tell whether it worked.
#
# Binding contract (SpiResourceProvider.loadConfig -> ProviderBasedConfigService.bindToClass):
# the section is bound to the ResourceFactory's `configType()`, here
# `DurableEntityConfig(String keyspace, int partitionCount, Option<Integer> replicationFactor,
# Option<Integer> confirmationFactor)` (#1564). The binder prefers the record's static
# `durableEntityConfig(...)` factory over its constructor, so the rules below are enforced at BIND time
# and a rejected value fails slice loading with a named cause. Record components are looked up after
# `toSnakeCase`, so `partitionCount` must be spelled `partition_count`. `keyspace` and
# `partition_count` must be present; `replication_factor` and `confirmation_factor` are optional and
# resolve against the committed cluster `[replication]` defaults at provisioning. The record is
# @StrictKeys: a key it does not declare fails the bind.
[entities.orders]
keyspace = "orders"

# The number of (keyspace, partition) ownership arcs "orders" keys are spread across. This is the
# fence GRANULARITY: a reshuffle that moves one arc must not fence a key that hashes to another,
# which is the property PartitionFencedDurableEntityFenceTest pins down. Small enough that a 5-node
# cluster puts several arcs on every node.
partition_count = 8

# HONOURED (#345 I3), after two earlier readings of this same field. I0 declared 3 here and got
# exactly one un-replicated process-local copy: accepted, recorded, and silently meaningless. I1
# made that loud by refusing anything but 1, which was the honest answer while entity state lived in
# a per-node StorageEngine that nothing spanned. I3 moved entity state onto a fenced, fsync-durable,
# replicated stream partition, so the field finally buys what it always claimed to.
#
# This is the total number of copies of each partition INCLUDING the owner, and it becomes the
# backing stream's replication factor. With no `confirmation_factor` declared, CF resolves to
# min(cluster default 2, 3) = 2 — the owner plus one peer must hold a record before the write acks —
# which is what makes state survive the OWNER'S DEATH and not merely its restart. A factor below 3 may
# be declared (#1564), with a LOUD warning; it is the weaker guarantee and has to be asked for on purpose.
replication_factor = 3
