# Application-level (blueprint) resources for test-entity (#345 increment I0).
#
# Packaged into the blueprint JAR as META-INF/resources.toml by the JBCT maven-plugin. At deploy
# time BlueprintService stores this content in the KV-Store; each node's slice loader resolves the
# @Durable qualifier's `config = "entities.orders"` lookup against it.
#
# THIS IS THE FIRST DurableEntity RESOURCE DECLARATION IN THE REPOSITORY. Before it, nothing
# anywhere named a durable entity, so `resource/durable-entity` was unreachable from any running
# node and no build could tell whether it worked.
#
# Binding contract (SpiResourceProvider.loadConfig -> ProviderBasedConfigService.bindToClass):
# the section is bound to the ResourceFactory's `configType()`, here
# `DurableEntityConfig(String keyspace, int replicationFactor)`. Record components are looked up
# after `toSnakeCase`, so `replicationFactor` must be spelled `replication_factor`. Every component
# must be present — the binder has no default-value fallback.
[entities.orders]
keyspace = "orders"

# Accepted and RECORDED, but not enforced: today's DurableEntityFactory ignores it entirely and
# returns a single-process in-memory entity. Declaring 3 here is deliberate — it is the value that
# #345 I1 must either honor or refuse loudly, and the fixture's cross-node assertions currently
# prove it is doing neither.
replication_factor = 3
