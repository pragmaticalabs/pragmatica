prefix = "/api/stream-consumer"

[security]
# Test fixture: public routes so the forge proof can drive publish/received without auth setup.
default = "public"
override_policy = "strengthen_only"

# onConsumerEvent and onOrderPlaced are deliberately absent — they are declarative stream consumers,
# reachable only via the framework's delivery path, never over HTTP. If they were routable the proof
# would be vacuous.
[routes]
publish = "POST /publish"
received = "POST /received"
publishOrder = "POST /publish-order"
receivedOrders = "POST /received-orders"

[errors]
default = 500
HTTP_400 = ["*Invalid*"]
