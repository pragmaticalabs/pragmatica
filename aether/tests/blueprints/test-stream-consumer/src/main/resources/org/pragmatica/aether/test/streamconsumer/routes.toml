prefix = "/api/stream-consumer"

[security]
# Test fixture: public routes so the forge proof can drive publish/received without auth setup.
default = "public"
override_policy = "strengthen_only"

# onConsumerEvent, onOrderPlaced and onSpreadEvent are deliberately absent — they are declarative
# stream consumers, reachable only via the framework's delivery path, never over HTTP. If they were
# routable the proof would be vacuous.
[routes]
publish = "POST /publish"
received = "POST /received"
publishOrder = "POST /publish-order"
receivedOrders = "POST /received-orders"
publishSpread = "POST /publish-spread"
receivedSpread = "POST /received-spread"

[errors]
default = 500
HTTP_400 = ["*Invalid*"]
