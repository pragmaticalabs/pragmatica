# nginx management-API sidecar gateway -- Cluster A
#
# Provides a stable host-mapped management endpoint that survives any single
# core failure. Without this, MGMT_ENTRY_POINT is pinned to one core's host-mapped
# port -- destructive tests that kill that core strand the harness.
#
# Each /api/* (and /health/*) request is forwarded to ANY healthy core. nginx's
# proxy_next_upstream skips a core that returned a connection error / timeout
# and tries the next, so a single dead core is invisible to the client. The
# product's existing HttpForwardRequest then routes the call to the correct
# node internally (leader / governor / state owner).
#
# This is the test-infra equivalent of the production LB sidecar -- it never
# participates in cluster membership, has no cluster role, and can be killed +
# restarted independently. RC1 scope: docker compose only; cloud/Hetzner is a
# follow-up (see session handover).

worker_processes 1;
events { worker_connections 256; }

http {
    # Resolve cluster-internal hostnames at runtime; without this nginx caches
    # the first DNS lookup forever and a renamed/replaced container is never
    # picked up. compose's embedded DNS lives at 127.0.0.11.
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format gateway '[$time_local] $remote_addr "$request" '
                      '-> $upstream_addr $upstream_status (rt=$request_time)';
    access_log /var/log/nginx/access.log gateway;
    error_log  /var/log/nginx/error.log warn;

    # 5-node upstream pool. proxy_next_upstream below treats any of the listed
    # failure modes as "try the next server"; max_fails=1 + fail_timeout=5s
    # parks a failing core for 5s before retrying. With 5 cores and 4 healthy,
    # the worst case is one wasted 2s connect attempt per request batch.
    upstream aether_cores {
        server aether-a-node-1:8080 max_fails=1 fail_timeout=5s;
        server aether-a-node-2:8080 max_fails=1 fail_timeout=5s;
        server aether-a-node-3:8080 max_fails=1 fail_timeout=5s;
        server aether-a-node-4:8080 max_fails=1 fail_timeout=5s;
        server aether-a-node-5:8080 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 8080;

        # Generous timeouts -- some management ops (blueprint deploy, scale)
        # legitimately take 30s+. The test harness sets its own outer timeout
        # via curl/aether-cli, so we just need to not be the bottleneck.
        proxy_connect_timeout 2s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;

        # Failover semantics: try the next upstream on connection-level errors,
        # timeouts, or 5xx (502/503/504). Do NOT retry on 4xx -- those are
        # genuine API errors that should propagate.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 5;
        proxy_next_upstream_timeout 30s;

        location / {
            proxy_pass http://aether_cores;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Gateway's own liveness probe -- never proxied. Lets the test harness
        # distinguish "gateway up, all cores dead" from "gateway down" without
        # forcing a round-trip through proxy_next_upstream.
        location = /gateway/live {
            access_log off;
            return 200 "ok\n";
        }
    }
}
