# Integration test cluster — 5-node Docker deployment
# Minimal config that passes ClusterBootstrapConfigValidator
config_version = "1.0.0"

[cluster]
name = "integration-test"
version = "1.0.0"

[cluster.core]
min = 3
max = 15
max_unavailable = 1

[source.docker]
type = "docker"

[source.docker.core]
count = 5

[operations.ports]
cluster = 6000
management = 8080
app_http = 8070
swim = 6100
