# Integration test cluster — 5-node Docker deployment
# Minimal config that passes ClusterConfigValidator

[cluster]
name = "integration-test"
version = "1.0.0"
environment = "docker"

[cluster.core]
count = 5
min = 3
max = 15

[deployment]
type = "embedded"

[deployment.runtime]
type = "container"
image = "aether-node:local"
