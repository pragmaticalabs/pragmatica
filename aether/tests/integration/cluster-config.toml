# Integration test cluster — 5-node on-premises Docker deployment
# Sensitive values (API keys, SSH keys) come from environment variables

[cluster]
name = "integration-test"
version = "1.0.0-rc1"
environment = "docker"

[cluster.core]
count = 5
min = 3
max = 15

[cluster.ports]
management = 5150
cluster = 6000
app-http = 8070

[deployment]
type = "on-premises"
image = "aether-node:local"

[deployment.runtime]
type = "container"

[node]
heap = "256m"
gc = "zgc"
