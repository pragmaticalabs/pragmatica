# Cluster B (JVM mode) -- Hetzner Cloud (destructive test suites)
#
# 5-node cluster on Hetzner cx33 instances (4 vCPU, 8 GB RAM).
# Requires HCLOUD_TOKEN and PG_URL environment variables.

config_version = "1.0.0"

[cluster]
name = "cloud-test-b-jvm"
version = "1.0.0"

[cluster.core]
min = 3
max = 9
max_unavailable = 1

[source.hetzner-eu]
type = "cloud"
provider = "hetzner"
# `zones` is an ordered fallback list of Hetzner location codes. The bootstrap provisions
# each node into the first zone with capacity, rotating to the next on a 412
# `resource_unavailable` ("error during placement") response — so a single full zone no
# longer aborts the whole cluster bootstrap. Different nodes may land in different zones
# (cross-zone is desirable). A single `zone = "<loc>"` still works (treated as a 1-element
# list); when neither `zone` nor `zones` is set the provider falls back to `region`.
zones = ["fsn1", "nbg1", "hel1"]
region = "fsn1"           # Default location used when no zone placement hint is set (single-attempt fallback).
credentials = "${env:HCLOUD_TOKEN}"
load_balancer = "none"
databases.forge = "${env:PG_URL}"

[source.hetzner-eu.core]
count = 5
instance_type = "cx33"
image = "ubuntu-22.04"

[infrastructure.networking]
# Option A — direct public-IP addressing.
# Each provisioned VM receives a public IP (Hetzner default); the integration
# test harness reads those IPs from ~/.aether/clusters/cloud-test-b/bootstrap-state.json
# (BOOTSTRAP_CLUSTER_NAME) and SSHs to nodes directly. No private network, no
# bastion. Option B (private network + bastion) is deferred to Phase 4.
type = "manual"

[operations]

[operations.tls]
# Disabled for integration testing — mgmt API uses plain HTTP for curl/wget health
# checks. Cluster QUIC transport still uses TLS via auto-generated [tls].cluster_secret.
# The cert-rotation test runs against a TLS-disabled cluster and gets a vacuous PASS;
# real cert-rotation E2E coverage tracked in #209 (RC2).
auto_generate = false

[operations.ports]
cluster = 6000
management = 8080
app_http = 8070
swim = 6100

[operations.auto_heal]
enabled = true
retry_interval = "30s"
startup_cooldown = "15s"
# Integration-test tuning (Wave 3 / Theme B): faster provisioning gate for chaos.
provision_stability_window = "5s"
provisioning_timeout = "60s"

[source.hetzner-eu.node_config.app-http]
# Cluster B runs 05-security tests which assert that unauthenticated requests are
# rejected — keep API_KEY mode with the static test key configured. The bootstrap
# CLI uses this same key to authenticate formation POSTs (see
# BootstrapPhaseFormation.extractConfiguredApiKey).
enabled = true
security_mode = "API_KEY"

# Rich-syntax key entry — ADMIN role required because formation POSTs hit
# /api/cluster/config and /api/cluster/keys, both gated on ADMIN.
# Simple `api_keys = [...]` defaults to VIEWER (per ApiKeyEntry.defaultEntry)
# and would yield HTTP 403 during bootstrap.
[source.hetzner-eu.node_config.app-http.api-keys.aether-integration-test-key]
name = "integration-test"
roles = ["service"]
authorization_role = "ADMIN"

# Per-key RBAC roles for 05-security's viewer/operator coverage. The section-header
# suffix after `api-keys.` IS the literal key value the harness sends as X-API-Key
# (AETHER_VIEWER_API_KEY / AETHER_OPERATOR_API_KEY in run-tests.sh). authorization_role
# drives enforcement (ADMIN > OPERATOR > VIEWER); without these blocks VIEWER_API_KEY /
# OPERATOR_API_KEY are empty and the viewer tests skip + the operator test is vacuous.
[source.hetzner-eu.node_config.app-http.api-keys.aether-integration-viewer-key]
name = "integration-viewer"
roles = ["service"]
authorization_role = "VIEWER"

[source.hetzner-eu.node_config.app-http.api-keys.aether-integration-operator-key]
name = "integration-operator"
roles = ["service"]
authorization_role = "OPERATOR"

# @PgSql slices read the FLAT [database] datasource (config="database"). databases.X
# produces nested [database.X] the connector ignores; inject flat [database] via node_config.
[source.hetzner-eu.node_config.database]
username = "${env:PG_USER}"
password = "${env:PG_PASSWORD}"
async_url = "postgresql://${env:PG_HOST}:5432/${env:PG_DB}"

[runtime.default]
type = "jvm"
# Cluster version is 1.0.0 (strict semver); the JVM-mode URL deriver would
# produce v1.0.0/aether-node.jar, but the rc2 candidate JAR is published under
# v1.0.0-rc2-candidate. Pin the candidate JAR explicitly.
jar_url = "https://github.com/pragmaticalabs/pragmatica/releases/download/v1.0.0-rc2-candidate/aether-node.jar"
