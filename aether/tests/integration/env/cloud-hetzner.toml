# Cluster A -- Hetzner Cloud (non-destructive test suites)
#
# 5-node cluster on Hetzner cpx32 instances (4 vCPU, 8 GB RAM).
# Requires HCLOUD_TOKEN and PG_URL environment variables.

config_version = "1.0.0"

[cluster]
name = "cloud-test-a"
version = "1.0.0"

[cluster.core]
min = 3
max = 9
max_unavailable = 1

[source.hetzner-eu]
type = "cloud"
provider = "hetzner"
# `zones` is an ordered fallback list of Hetzner location codes. The bootstrap provisions
# each node into the first zone with capacity, rotating to the next on a 412
# `resource_unavailable` ("error during placement") response — so a single full zone no
# longer aborts the whole cluster bootstrap. Different nodes may land in different zones
# (cross-zone is desirable). A single `zone = "<loc>"` still works (treated as a 1-element
# list); when neither `zone` nor `zones` is set the provider falls back to `region`.
zones = ["fsn1", "nbg1", "hel1"]
region = "nbg1"           # Default location used when no zone placement hint is set (single-attempt fallback).
credentials = "${env:HCLOUD_TOKEN}"
load_balancer = "none"
databases.forge = "${env:PG_URL}"

[source.hetzner-eu.core]
count = 5
instance_type = "cpx32"
image = "ubuntu-22.04"

[infrastructure.networking]
# Option A — direct public-IP addressing.
# Each provisioned VM receives a public IP (Hetzner default); the integration
# test harness reads those IPs from ~/.aether/clusters/cloud-test-a/bootstrap-state.json
# (BOOTSTRAP_CLUSTER_NAME) and SSHs to nodes directly. No private network, no
# bastion. Option B (private network + bastion) is deferred to Phase 4.
type = "manual"

[operations]

[operations.tls]
# Disabled for integration testing — mgmt API uses plain HTTP for curl/wget health
# checks. Cluster QUIC transport still uses TLS via auto-generated [tls].cluster_secret.
auto_generate = false

[operations.ports]
cluster = 6000
management = 8080
app_http = 8070
swim = 6100

[operations.auto_heal]
enabled = true
retry_interval = "30s"
startup_cooldown = "15s"

[source.hetzner-eu.node_config.app-http]
# Integration test config: app-http server enabled, security disabled.
# - `enabled = true` starts the slice's app-HTTP server (port 8070).
# - `security_mode = "NONE"` opens both app-http AND mgmt-api to unauthenticated requests
#   (mgmt validator uses noOpValidator when securityEnabled() returns false).
#   This avoids the bootstrap chicken-and-egg: with API_KEY mode, the bootstrap's
#   storeClusterConfig POST is rejected because the bootstrap-generated key isn't in KV
#   yet and the static key isn't in this composed config either.
# Production deployments must set security_mode = "API_KEY" with a configured key list.
enabled = true
security_mode = "NONE"

# @PgSql slices resolve the FLAT datasource section named "database"
# (@ResourceQualifier config = "database"). `databases.X` produces a NESTED
# [database.X] table which the connector does NOT read; the connector reads the
# flat [database] section. node_config injects it flat into every node's
# aether.toml (mirrors docker's static node [database]). async_url carries the
# PG VM connection (type is inferred from the postgres:// scheme); without this
# the slice loads typeless → "Database type is required" → V900 never runs.
[source.hetzner-eu.node_config.database]
username = "${env:PG_USER}"
password = "${env:PG_PASSWORD}"
async_url = "postgresql://${env:PG_HOST}:5432/${env:PG_DB}"

[runtime.default]
type = "container"
image = "ghcr.io/pragmaticalabs/aether-node:1.0.0-rc2-candidate"
