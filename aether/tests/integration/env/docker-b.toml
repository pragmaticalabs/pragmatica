# Cluster B -- Local Docker (destructive test suites)
#
# 5-node cluster for sequential chaos/scaling/security tests.
# Shares PostgreSQL with Cluster A (docker.toml).

config_version = "1.0.0"

[cluster]
name = "test-b"
version = "1.0.0-rc1"

[cluster.core]
min = 3
max = 15
max_unavailable = 1

[source.docker]
type = "docker"
load_balancer = "elected"
databases.forge = "jdbc:postgresql://forge-postgres:5432/forge?user=forge&password=forge"

[source.docker.core]
count = 5

[infrastructure.networking]
type = "manual"

[operations.ports]
cluster = 6000
management = 8080
app_http = 8070
swim = 6100

[operations.auto_heal]
enabled = true
retry_interval = "30s"
startup_cooldown = "15s"
# Integration-test tuning (Wave 3 / Theme B): faster provisioning gate for chaos.
provision_stability_window = "5s"
provisioning_timeout = "60s"

[runtime.default]
type = "docker"
image = "aether-node:local"
