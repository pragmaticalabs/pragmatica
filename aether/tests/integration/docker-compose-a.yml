# Cluster A -- Non-destructive test suites (parallel execution)
#
# 5-node Aether cluster + shared PostgreSQL.
# PostgreSQL is connected to both aether-a-network and aether-b-network
# so Cluster B can share the same database.
#
# Usage:
#   docker compose -f docker-compose-a.yml up -d
#   docker compose -f docker-compose-a.yml down -v

x-node-common: &node-common
  image: aether-node:local
  networks:
    - aether-a-network
  group_add:
    - "${DOCKER_GID:-984}"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  environment: &node-env
    CLUSTER_PORT: "6000"
    MANAGEMENT_PORT: "8080"
    PEERS: "aether-a-node-1:aether-a-node-1:6000,aether-a-node-2:aether-a-node-2:6000,aether-a-node-3:aether-a-node-3:6000,aether-a-node-4:aether-a-node-4:6000,aether-a-node-5:aether-a-node-5:6000"
    CORE_MAX: "5"
    DOCKER_GID: "${DOCKER_GID:-984}"
    JAVA_OPTS: "-Xmx512m -XX:+UseZGC -Djava.net.preferIPv4Stack=true"
    AETHER_CLUSTER_SECRET: "aether-integration-test-cluster-secret"
    AETHER_DOCKER_NETWORK: "aether-a-network"
    # Cluster identity for CTM-provisioned replacement containers — without this,
    # DockerComputeProvider.clusterOrDefault falls back to "default" and replacements
    # carry `aether.cluster=default` which doesn't match the compose-fixed nodes'
    # `aether.cluster=a` label, breaking cross-cluster filter scoping.
    AETHER_CLUSTER_NAME: "a"
    # Cluster A claims host port range 5150-5159 for CTM-provisioned containers
    # (compose-defined nodes own 5151-5155 = slots 1-5 via port = base + slot;
    # auto-heal replacements pick from slot 6+ → 5156+). Cluster B uses 5160-5169.
    # Distinct ranges prevent port-bind collisions when CTM auto-provisions a
    # replacement in one cluster from colliding with the other's port window.
    # Read by DockerEnvironmentIntegrationFactory.resolvePortBase.
    AETHER_MGMT_PORT_BASE: "5150"
    AETHER_APP_PORT_BASE: "8069"
    # Test cluster: enable dev-mode endpoints (scheduled-tasks/inject, alerts/inject,
    # traces/inject, dht/inject, certificates/configure-short-validity). Production
    # clusters keep this unset. Required by suite 08's Last_execution_advances and
    # other test-only injection paths.
    AETHER_INSECURE_DEV_MODE: "true"
  healthcheck:
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 30s
  # restart: "no" — Aether's CTM auto-heal owns failure recovery; container restart
  # policy must not compete with it. See aether/docs/operator/deployment-recovery.md.
  restart: "no"

services:
  # --- PostgreSQL (shared with Cluster B via dual network) ---
  postgres:
    image: postgres:17-alpine
    container_name: forge-postgres
    hostname: forge-postgres
    networks:
      - aether-a-network
      - aether-b-network
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # #598: creates forge_testpersistence (test-persistence's own physical database)
      # on every fresh pgdata volume. deploy_docker scp's this dir alongside the
      # compose file on remote runs — keep the relative path.
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- 5-node Aether Cluster A ---
  # Direct per-node mgmt ports 5151-5155 (node-1..node-5). Slot 5150 is
  # intentionally unbound; the test harness reaches the cluster by probing
  # 5151..5155 for any live core (lib/common.sh _refresh_mgmt_entry_point).
  # The MGMT_PORT+i convention resolves node-{i+1} → 5151+i.
  aether-a-node-1:
    <<: *node-common
    container_name: aether-a-node-1
    hostname: aether-a-node-1
    labels:
      aether.cluster: "a"
      aether.node-id: "aether-a-node-1"
    environment:
      <<: *node-env
      NODE_ID: "aether-a-node-1"
    ports:
      - "5151:8080"   # Direct mgmt
      - "8070:8070"   # App HTTP
      - "9090:8070"   # LB app port
      - "9091:8080"   # LB mgmt port
    depends_on:
      postgres:
        condition: service_healthy

  aether-a-node-2:
    <<: *node-common
    container_name: aether-a-node-2
    hostname: aether-a-node-2
    labels:
      aether.cluster: "a"
      aether.node-id: "aether-a-node-2"
    environment:
      <<: *node-env
      NODE_ID: "aether-a-node-2"
    ports:
      - "5152:8080"
      - "8071:8070"

  aether-a-node-3:
    <<: *node-common
    container_name: aether-a-node-3
    hostname: aether-a-node-3
    labels:
      aether.cluster: "a"
      aether.node-id: "aether-a-node-3"
    environment:
      <<: *node-env
      NODE_ID: "aether-a-node-3"
    ports:
      - "5153:8080"
      - "8072:8070"

  aether-a-node-4:
    <<: *node-common
    container_name: aether-a-node-4
    hostname: aether-a-node-4
    labels:
      aether.cluster: "a"
      aether.node-id: "aether-a-node-4"
    environment:
      <<: *node-env
      NODE_ID: "aether-a-node-4"
    ports:
      - "5154:8080"
      - "8073:8070"

  aether-a-node-5:
    <<: *node-common
    container_name: aether-a-node-5
    hostname: aether-a-node-5
    labels:
      aether.cluster: "a"
      aether.node-id: "aether-a-node-5"
    environment:
      <<: *node-env
      NODE_ID: "aether-a-node-5"
    ports:
      - "5155:8080"
      - "8074:8070"

networks:
  aether-a-network:
    name: aether-a-network
    driver: bridge
  aether-b-network:
    name: aether-b-network
    driver: bridge

volumes:
  pgdata:
