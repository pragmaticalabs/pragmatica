# Cluster A -- Non-destructive test suites (parallel execution)
#
# 5-node Aether cluster + shared PostgreSQL.
# PostgreSQL is connected to both aether-a-network and aether-b-network
# so Cluster B can share the same database.
#
# Usage:
#   docker compose -f docker-compose-a.yml up -d
#   docker compose -f docker-compose-a.yml down -v

x-node-common: &node-common
  image: aether-node:local
  networks:
    - aether-a-network
  group_add:
    - "${DOCKER_GID:-984}"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  environment: &node-env
    CLUSTER_PORT: "6000"
    MANAGEMENT_PORT: "8080"
    PEERS: "node-1:aether-a-node-1:6000,node-2:aether-a-node-2:6000,node-3:aether-a-node-3:6000,node-4:aether-a-node-4:6000,node-5:aether-a-node-5:6000"
    CORE_MAX: "5"
    DOCKER_GID: "${DOCKER_GID:-984}"
    JAVA_OPTS: "-Xmx512m -XX:+UseZGC -Djava.net.preferIPv4Stack=true"
    AETHER_CLUSTER_SECRET: "aether-integration-test-cluster-secret"
    AETHER_DOCKER_NETWORK: "aether-a-network"
    # Cluster A claims host port range 5150-5159 for CTM-provisioned containers
    # (compose-defined nodes own 5150-5155; auto-heal replacements pick from 5156+).
    # Cluster B uses 5160-5169. Distinct ranges prevent port-bind collisions when
    # CTM auto-provisions a phantom replacement for cluster A using cluster B's
    # baked-in 5160 base. Read by DockerEnvironmentIntegrationFactory.resolvePortBase.
    AETHER_MGMT_PORT_BASE: "5156"
    AETHER_APP_PORT_BASE: "8075"
  healthcheck:
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 30s
  # restart: "no" — Aether's CTM auto-heal owns failure recovery; container restart
  # policy must not compete with it. See aether/docs/operator/deployment-recovery.md.
  restart: "no"

services:
  # --- PostgreSQL (shared with Cluster B via dual network) ---
  postgres:
    image: postgres:17-alpine
    container_name: forge-postgres
    hostname: forge-postgres
    networks:
      - aether-a-network
      - aether-b-network
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- 5-node Aether Cluster A ---
  # Direct per-node mgmt ports moved to 5151-5155 (was 5150-5154). 5150 is now
  # owned by the mgmt sidecar gateway (aether-a-mgmt-gateway) so MGMT_ENTRY_POINT
  # survives any single-core failure. The MGMT_PORT+i convention now resolves
  # node-i+1 -> 5151+i; lib/cluster.sh + run-tests.sh rebased to 5151.
  aether-a-node-1:
    <<: *node-common
    container_name: aether-a-node-1
    hostname: aether-a-node-1
    labels:
      aether.node-id: "node-1"
    environment:
      <<: *node-env
      NODE_ID: "node-1"
    ports:
      - "5151:8080"   # Direct mgmt (gateway-bypass)
      - "8070:8070"   # App HTTP
      - "9090:8070"   # LB app port
      - "9091:8080"   # LB mgmt port
    depends_on:
      postgres:
        condition: service_healthy

  aether-a-node-2:
    <<: *node-common
    container_name: aether-a-node-2
    hostname: aether-a-node-2
    labels:
      aether.node-id: "node-2"
    environment:
      <<: *node-env
      NODE_ID: "node-2"
    ports:
      - "5152:8080"
      - "8071:8070"

  aether-a-node-3:
    <<: *node-common
    container_name: aether-a-node-3
    hostname: aether-a-node-3
    labels:
      aether.node-id: "node-3"
    environment:
      <<: *node-env
      NODE_ID: "node-3"
    ports:
      - "5153:8080"
      - "8072:8070"

  aether-a-node-4:
    <<: *node-common
    container_name: aether-a-node-4
    hostname: aether-a-node-4
    labels:
      aether.node-id: "node-4"
    environment:
      <<: *node-env
      NODE_ID: "node-4"
    ports:
      - "5154:8080"
      - "8073:8070"

  aether-a-node-5:
    <<: *node-common
    container_name: aether-a-node-5
    hostname: aether-a-node-5
    labels:
      aether.node-id: "node-5"
    environment:
      <<: *node-env
      NODE_ID: "node-5"
    ports:
      - "5155:8080"
      - "8074:8070"

  # --- Management API sidecar gateway ---
  # nginx reverse proxy that round-robins /api/* and /health/* requests across
  # the 5 cores via cluster-internal hostnames (aether-a-node-{1..5}:8080).
  # proxy_next_upstream skips dead cores. Owns host port 5150 so MGMT_ENTRY_POINT
  # is decoupled from any single core's lifecycle.
  aether-a-mgmt-gateway:
    image: nginx:1.27-alpine
    container_name: aether-a-mgmt-gateway
    hostname: aether-a-mgmt-gateway
    networks:
      - aether-a-network
    ports:
      - "5150:8080"   # MGMT_ENTRY_POINT (was node-1 direct)
    volumes:
      - ./nginx-mgmt-gateway-a.conf:/etc/nginx/nginx.conf:ro
    # nginx evaluates `upstream { server foo:port }` at config-load and aborts
    # with `host not found in upstream` if the hostname has no DNS entry yet.
    # depends_on with service_started waits for each core's container creation
    # (which is when Docker registers its embedded DNS record), so nginx's
    # upstream block resolves cleanly. service_started is enough — service_healthy
    # would deadlock since cores' healthchecks legitimately take ~60s, exceeding
    # depends_on's default budget.
    depends_on:
      aether-a-node-1: { condition: service_started }
      aether-a-node-2: { condition: service_started }
      aether-a-node-3: { condition: service_started }
      aether-a-node-4: { condition: service_started }
      aether-a-node-5: { condition: service_started }
    healthcheck:
      # 127.0.0.1 (not localhost): busybox wget resolves localhost to [::1] but
      # nginx `listen 8080` is IPv4-only, so `wget --spider localhost:8080`
      # always fails with "Connection refused" → container falsely "unhealthy"
      # even though /gateway/live returns 200 via IPv4.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/gateway/live"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    restart: "no"

networks:
  aether-a-network:
    name: aether-a-network
    driver: bridge
  aether-b-network:
    name: aether-b-network
    driver: bridge

volumes:
  pgdata:
