# nginx management-API sidecar gateway -- Cluster B (destructive suites)
#
# Cluster B uses `restart: "no"` so a killed core stays dead until the suite's
# cleanup phase compose-cycles the whole cluster. Without this gateway,
# MGMT_ENTRY_POINT is pinned to node-1's host-mapped port and every destructive
# test must dance around "don't kill node-1, don't elect node-1 leader, ..."
# accumulating skip gates (e.g. test-kill-leader.sh pinned-leader-skip).
#
# With this gateway, any core (including node-1, including the current leader)
# can be killed -- nginx skips dead upstreams and forwards to the next healthy
# one. The product's existing HttpForwardRequest then routes the call to the
# correct internal node (leader / governor / state owner).
#
# This is the test-infra equivalent of the production LB sidecar -- it never
# participates in cluster membership, has no cluster role, and survives core
# failures independently. RC1 scope: docker compose only; cloud/Hetzner is a
# follow-up (see session handover).

worker_processes 1;
events { worker_connections 256; }

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format gateway '[$time_local] $remote_addr "$request" '
                      '-> $upstream_addr $upstream_status (rt=$request_time)';
    access_log /var/log/nginx/access.log gateway;
    error_log  /var/log/nginx/error.log warn;

    upstream aether_cores {
        server aether-b-node-1:8080 max_fails=1 fail_timeout=5s;
        server aether-b-node-2:8080 max_fails=1 fail_timeout=5s;
        server aether-b-node-3:8080 max_fails=1 fail_timeout=5s;
        server aether-b-node-4:8080 max_fails=1 fail_timeout=5s;
        server aether-b-node-5:8080 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 8080;

        proxy_connect_timeout 2s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 5;
        proxy_next_upstream_timeout 30s;

        location / {
            proxy_pass http://aether_cores;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /gateway/live {
            access_log off;
            return 200 "ok\n";
        }
    }
}
