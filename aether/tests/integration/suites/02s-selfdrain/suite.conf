# suite.conf -- parsed by run-tests.sh (source'd as shell vars)
#
# 02s = the S19/S20 self-drain file ALONE, as a suite of its own.
#
# Why this exists: run_suite globs "$suite_dir"/test-*.sh and there is no per-test filter, so
# measuring the S19 quorum-loss race meant running all seven 02-chaos files — ~35 min (run 3:
# 2115s) for ONE attempt at a race that needs repetition. This suite is the same file, reached
# through a second directory entry, so a race round costs one file instead of seven.
#
# The test file is a SYMLINK into 02-chaos, deliberately: a copy would drift, and the two would
# disagree silently about what S19 asserts. 02-chaos still runs it as part of the full suite —
# this adds a way to run it alone, it does not move it.
tags=chaos
cluster=destructive
destructive=true
requires=CAP_CHAOS
blueprint=test-echo
estimated_duration=10m
description="S19/S20 self-drain under quorum loss, alone (race repetition)"
