# aether-cloud.toml — Cloud integration test cluster on Hetzner
#
# Usage:
#   export HCLOUD_TOKEN=<token>
#   aether cluster bootstrap aether-cloud.toml --yes --wait --timeout 600
#
# Teardown:
#   bash aether/tests/cloud/teardown-cloud.sh --yes

[cluster]
name = "cloud-test"
version = "1.0.0-rc4"

[cluster.core]
count = 5
min = 3
max = 9

[cluster.auto_heal]
enabled = true
retry_interval = "30s"
startup_cooldown = "15s"

[deployment]
type = "hetzner"
# Network ID is set by deploy-cloud.sh after creating the Hetzner private network
network_id = "${env:CLOUD_NETWORK_ID}"

[deployment.instances]
core = "cx22"

[deployment.runtime]
type = "container"
# Must match a tag published by .github/workflows/release.yml, which derives the tag
# from the pushed git tag (VERSION=${GITHUB_REF#refs/tags/v}). The moving candidate tag
# v1.0.0-rc3-candidate therefore publishes :1.0.0-rc3-candidate. A stale pin here does
# not fail loudly — deploy-cloud.sh swallows a failed pull — so it must be updated
# whenever the candidate tag's name changes.
image = "ghcr.io/pragmaticalabs/aether-node:1.0.0-rc3-candidate"

[deployment.zones]
zone-1 = "fsn1-dc14"

[deployment.ports]
cluster = 6000
management = 8080
app-http = 8070
swim = 6100

[deployment.tls]
auto_generate = true
cert_ttl = "720h"
