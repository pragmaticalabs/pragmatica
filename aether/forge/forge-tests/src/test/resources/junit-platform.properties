# JUnit Platform configuration for forge tests (#556).
#
# WHY A JUNIT-LEVEL TIMEOUT AND NOT failsafe's forkedProcessTimeoutInSeconds
#
# forge-tests already sets forkedProcessTimeoutInSeconds=1800, and it has FAILED TO REAP A HUNG
# FORK at least three times (twice during the 2026-08-26 #509 probe runs, once earlier). When it
# fails, the CI job hits its own 30-minute wall and the log contains ZERO actionable text: no
# failing test, no assertion, just "The action 'Run Forge tests' has timed out". Identifying the
# hung class then means diffing "Running <class>" lines against "Tests run: ... -- in <class>"
# lines by hand.
#
# A JUnit timeout fails the SPECIFIC test method with a TimeoutException naming it, and lets the
# remaining classes run instead of being cancelled with the job. That is the difference between a
# named failure and a silent wall.
#
# HONEST LIMIT [mechanism: JUnit timeouts interrupt the test thread]: a hang parked in a
# non-interruptible wait may not unblock. The timeout still marks the method failed and still names
# it in the report, which is the diagnostic value; it is not a guarantee that the JVM exits.
# forkedProcessTimeoutInSeconds stays in the pom as the outer backstop.
#
# THE VALUE IS DELIBERATELY GENEROUS. It exists to convert a hang into a name, NOT to enforce
# performance. The slowest legitimate class observed is PostRestartSlowRejoinDeficitFillProbeTest
# at ~109s for its slow-rejoin half (an 82s hold window plus restart and rejoin), and Heavy probes
# derive their own budgets from reconciler constants. 10 minutes clears all of them by a wide
# margin while still landing well inside the 30-minute CI job wall, so a genuinely wedged cluster
# is reported by name with time left for the other classes.
# VERIFIED, not assumed. Temporarily setting the lifecycle budget to 3s makes a real forge class
# fail as:
#     [ERROR] ClusterFormationTest » Timeout setUp() timed out after 3 seconds
# — the class AND the method are named, which is the whole acceptance criterion. Worth noting how
# that proof went: setting the TESTABLE-METHOD budget to 2s changed nothing, because these forge
# classes spend their time in @BeforeAll standing a cluster up, not in the @Test methods. So the
# LIFECYCLE budget is the one that actually catches a wedged cluster, and a config file that is
# present and parsed can still be inert against the case you care about. Aim the proof at the knob
# that matters.
junit.jupiter.execution.timeout.testable.method.default = 10m

# Lifecycle methods get their own budget. A hung @BeforeAll is exactly the case that used to consume
# the whole job silently, so this is where the real value is: these forge classes spend their time
# standing a cluster up, not in @Test bodies.
#
# 8m, NOT the 5m first written here. The tests' OWN awaits are the intended failure mechanism and
# this must never fire before them: the longest internal guard in the non-Heavy set is 240s
# (`FORM_TIMEOUT`/`WAIT_TIMEOUT` in MembershipBlackHoleSpikeTest, SliceInvocationTest,
# SliceVersioning*, PerSliceDecisionSnapshotProbeTest), and those guards sit inside setup that does
# more besides. At 5m a formation that was slow but SUCCEEDING on a loaded CI runner could trip this
# backstop and turn a pass into a flaky failure — manufacturing the instability it exists to
# diagnose. 8m is double the longest internal guard and still leaves ~22 minutes of the 30-minute CI
# job wall, so an actual hang is still named with room to spare.
junit.jupiter.execution.timeout.lifecycle.method.default = 8m
