# #3029: this module entered the CI JBCT gate. Format and every lint rule not listed here are enforced.
# The rules below are pinned to warning (visible, non-failing) for the stated reason, the same way the root
# jbct.toml pins CAUSE-01/02 (#720). Burn down by removing a line when its findings reach zero.

[lint.rules]
# EX-01: throws/throw mandated by the JDBC/jOOQ/Jackson/JPA/socket APIs this module adapts, or constructor/deserialize guards at the adapter boundary
JBCT-EX-01 = "warning"
# RET-01: void return mandated by the host API (JDK/Netty/JDBC/jOOQ/R2DBC/Jackson callbacks, AutoCloseable.close, annotation-processor init) or fire-and-forget I/O; the signature is the API where it is not our choice
JBCT-RET-01 = "warning"
# RET-03: null return at a driver/wire-protocol boundary; Option migration pending
JBCT-RET-03 = "warning"
# RET-06: null-tolerant parsing/conversion helper at a driver boundary; Option migration pending
JBCT-RET-06 = "warning"
# RET-07: terminal onSuccess/onFailure sink chain used as a side-effect statement; lint reports it as a discarded result
JBCT-RET-07 = "warning"
