prefix = "/api/v1/orders"

# #763: an absent [security] section now inherits the global security_mode instead of defaulting
# to public. This is a no-auth demo (run-forge.sh curls it with no credentials) -- make that
# explicit rather than relying on the pre-#763 implicit-public behavior.
[security]
default = "public"

[routes]
processOrder = "POST /"

[errors]
default = 500
HTTP_400 = ["*ValidationFailed*", "*InvalidAmount*"]
HTTP_500 = ["*PersistenceFailed*"]
