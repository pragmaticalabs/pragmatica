[api]
prefix = "/api/catalog"
requireVersionHeader = false

# #763: an absent [security] section now inherits the global security_mode instead of defaulting
# to public. This is a no-auth demo -- make that explicit rather than relying on the pre-#763
# implicit-public behavior. [security] is a single top-level table shared across all versions
# (RouteConfigLoader.parseSecurity reads it once, before per-version routes are parsed).
[security]
default = "public"

[v1.routes]
list = "GET /items"
get = "GET /items/{id:Long}"

[v1]
deprecated = true
sunset = "2026-12-31"

[v2.routes]
list = "GET /items"
get = "GET /items/{id:Long}"
exportCsv = { route = "GET /items.csv", produces = "text/csv" }
image = { route = "GET /items/{id:Long}/image", produces = "application/octet-stream" }
importCsv = { route = "POST /import", consumes = "text/csv" }

[v2]
defaultIfMissing = true

[errors]
default = 500
HTTP_404 = ["*NotFound*"]
HTTP_400 = ["*Invalid*"]
