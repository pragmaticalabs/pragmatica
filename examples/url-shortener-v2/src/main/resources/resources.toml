# The `click-events` topic is declared once as the shared Topic<ClickEvent> CLICK_EVENTS constant
# (see shared/Topics.java) and referenced from both slices via @ResourceQualifier(config =
# "CLICK_EVENTS"). Its name is generated into each slice manifest by the slice processor (#396), so
# no [click-events] topic_name section is written here.

[database]
type = "POSTGRESQL"
name = "url-shortener-v2"
host = "localhost"
port = 5432
database = "forge"
username = "forge"
password = "forge"
async_url = "postgresql://localhost:5432/forge"

[database.pool_config]
min_connections = 4
max_connections = 20
idle_timeout = "10m"
connection_timeout = "5s"
max_lifetime = "30m"
leak_detection_timeout = "0s"
io_threads = 0
