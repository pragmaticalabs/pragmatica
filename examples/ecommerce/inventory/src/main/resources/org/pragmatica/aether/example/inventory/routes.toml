prefix = "/api/v1/inventory"

# #763: an absent [security] section now inherits the global security_mode instead of defaulting
# to public. This is a no-auth demo -- make that explicit rather than relying on the pre-#763
# implicit-public behavior.
[security]
default = "public"

[routes]
checkStock = "POST /check"
reserveStock = "POST /reserve"
releaseStock = "POST /release"

[errors]
default = 500
HTTP_404 = ["*NotFound*"]
HTTP_400 = ["*Insufficient*", "*Invalid*"]
HTTP_409 = ["*Expired*"]
